<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List — Cuban Sandwiches</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f2f2f0;
    color: #111;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    margin: 0 auto;
    max-width: 480px;
    padding: 32px 20px 60px;
  }

  .page-title {
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .page-sub {
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .section {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .section-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    padding: 9px 16px;
  }

  .section-header.need {
    background: #111;
    color: #fff;
  }

  .item-list { padding: 6px 0; }

  .item {
    align-items: flex-start;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    display: flex;
    gap: 14px;
    padding: 10px 16px;
  }

  .item:last-child { border-bottom: 0; }

  .item input[type="checkbox"] {
    accent-color: #111;
    cursor: pointer;
    flex-shrink: 0;
    height: 16px;
    margin-top: 2px;
    width: 16px;
  }

  .item label {
    color: #111;
    cursor: pointer;
    flex: 1;
    font-size: 14.5px;
    line-height: 1.4;
    pointer-events: none;
  }

  .item input[type="checkbox"]:checked ~ label {
    color: #aaa;
    text-decoration: line-through;
  }

  .item-note {
    color: #999;
    display: block;
    font-size: 11.5px;
    margin-top: 1px;
  }
</style>
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<style>.back-bar{position:sticky;top:0;z-index:1000;background:#171717;border-bottom:1px solid #2c2c2c;padding:4px 10px;margin:-32px -20px 28px;}.back-bar a{color:#b8953a;text-decoration:none;font-family:-apple-system,sans-serif;font-size:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;}</style>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Cuban Sandwiches</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-0">
      <label for="cuban-sandwiches-0">Simple salad greens or extra pickles<span class="item-note">Optional side</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Meat/Seafood</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-1">
      <label for="cuban-sandwiches-1">Roast pork or pork tenderloin<span class="item-note">About 8 oz cooked or quick-cooked</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-2">
      <label for="cuban-sandwiches-2">Deli ham<span class="item-note">4-6 slices</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-3">
      <label for="cuban-sandwiches-3">Swiss cheese<span class="item-note">4 slices</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-4">
      <label for="cuban-sandwiches-4">Butter<span class="item-note">For outside of bread</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Bakery</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-5">
      <label for="cuban-sandwiches-5">Soft rolls, hoagies, or Cuban bread<span class="item-note">2 sandwich-size pieces</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-6">
      <label for="cuban-sandwiches-6">Yellow mustard<span class="item-note">For spreading</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="cuban-sandwiches-7">
      <label for="cuban-sandwiches-7">Dill pickles<span class="item-note">Sandwich slices or chips</span></label>
    </div>
  </div>
</div>

<script src="../grocery-boom.js?v=1"></script>
<script>
const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
const key = 'cuban-sandwiches-grocery-v1';
const saved = JSON.parse(localStorage.getItem(key) || '{}');
boxes.forEach((box) => {
  box.checked = !!saved[box.id];
  box.addEventListener('change', () => {
    saved[box.id] = box.checked;
    localStorage.setItem(key, JSON.stringify(saved));
    window.GroceryBoom && window.GroceryBoom.check(boxes);
  });
});
</script>
</body>
</html>
