<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuban Sandwiches Grocery List</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="wrap">
  <div class="hero">
    <div class="hero-title">Cuban <span>Sandwiches</span></div>
    <div class="hero-sub">Grocery List</div>
  </div>

  <div class="section-block">
    <div class="sec">Bakery</div>
    <label class="check-row"><input type="checkbox"><span>Soft rolls, hoagies, or Cuban bread <em>2 sandwich-size pieces</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Meat/Seafood</div>
    <label class="check-row"><input type="checkbox"><span>Roast pork or pork tenderloin <em>About 8 oz cooked or quick-cooked</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Deli ham <em>4-6 slices</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Dairy</div>
    <label class="check-row"><input type="checkbox"><span>Swiss cheese <em>4 slices</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Butter <em>For outside of bread</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Pantry</div>
    <label class="check-row"><input type="checkbox"><span>Yellow mustard <em>For spreading</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Dill pickles <em>Sandwich slices or chips</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Produce</div>
    <label class="check-row"><input type="checkbox"><span>Simple salad greens or extra pickles <em>Optional side</em></span></label>
  </div>
</div>
<script src="../grocery-boom.js?v=1"></script>
<script>
const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
const key = 'cuban-sandwiches-grocery-v1';
const saved = JSON.parse(localStorage.getItem(key) || '{}');
boxes.forEach((box, index) => {
  box.id = 'cuban-sandwiches-' + index;
  box.checked = !!saved[box.id];
  box.addEventListener('change', () => {
    saved[box.id] = box.checked;
    localStorage.setItem(key, JSON.stringify(saved));
    window.GroceryBoom && window.GroceryBoom.check(boxes);
  });
});
</script>
</body>
</html>
