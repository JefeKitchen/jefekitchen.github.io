<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baked Salmon with Rice & Cucumber Grocery List</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="wrap">
  <div class="hero">
    <div class="hero-title">Baked Salmon <span>Rice & Cucumber</span></div>
    <div class="hero-sub">Grocery List</div>
  </div>

  <div class="section-block">
    <div class="sec">Produce</div>
    <label class="check-row"><input type="checkbox"><span>English cucumber <em>1</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Lemon <em>1</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Dill <em>Small bunch, optional</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Meat/Seafood</div>
    <label class="check-row"><input type="checkbox"><span>Salmon fillets <em>1-1 1/4 lb</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Dairy</div>
    <label class="check-row"><input type="checkbox"><span>Greek yogurt <em>Optional for sauce</em></span></label>
  </div>

  <div class="section-block">
    <div class="sec">Pantry</div>
    <label class="check-row"><input type="checkbox"><span>White rice <em>1 cup dry</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Rice vinegar <em>For cucumber</em></span></label>
    <label class="check-row"><input type="checkbox"><span>Soy sauce <em>Optional drizzle</em></span></label>
  </div>
</div>
<script src="../grocery-boom.js?v=1"></script>
<script>
const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
const key = 'baked-salmon-rice-cucumber-grocery-v1';
const saved = JSON.parse(localStorage.getItem(key) || '{}');
boxes.forEach((box, index) => {
  box.id = 'baked-salmon-rice-cucumber-' + index;
  box.checked = !!saved[box.id];
  box.addEventListener('change', () => {
    saved[box.id] = box.checked;
    localStorage.setItem(key, JSON.stringify(saved));
    window.GroceryBoom && window.GroceryBoom.check(boxes);
  });
});
</script>
</body>
</html>
