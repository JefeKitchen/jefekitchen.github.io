<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List — Jalapeño Gruyère Chicken</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f2f2f0;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: #111;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    color: #111;
    line-height: 1;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 28px;
  }
  .section {
    margin-bottom: 16px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ddd;
  }
  .section-header {
    padding: 9px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
  }
  .section-header.need { background: #111; color: #fff; }
  .section-header.have { background: #888; color: #fff; }
  .divider-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: #888;
    text-align: center;
    margin: 28px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .divider-label::before,
  .divider-label::after { content: ''; flex: 1; height: 1px; background: #ccc; }
  .item-list { padding: 6px 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: #111;
    cursor: pointer;
  }
  .item.have-item input[type="checkbox"] { accent-color: #888; }
  .item label {
    font-size: 14.5px;
    color: #111;
    cursor: pointer;
    flex: 1;
    line-height: 1.4;
    pointer-events: none;
  }
  .item input[type="checkbox"]:checked ~ label {
    color: #aaa;
    text-decoration: line-through;
  }
  .item-note {
    font-size: 11.5px;
    color: #999;
    display: block;
    margin-top: 1px;
  }

</style>
<link rel="stylesheet" href="./theme.css?v=2">
</head>
<body>
<style>.back-bar{position:sticky;top:0;z-index:1000;background:#171717;border-bottom:1px solid #2c2c2c;padding:4px 10px;}.back-bar a{color:#b8953a;text-decoration:none;font-family:-apple-system,sans-serif;font-size:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;}</style>
<div class="back-bar"><a href="../index.html" aria-label="Back to kitchen">&#8249;</a></div>


<div class="page-title">Grocery List</div>
<div class="page-sub">Jalapeño Gruyère Chicken · Serves 1</div>

<!-- NEED -->
<div class="section">
  <div class="section-header need">Meat</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i1">
      <label for="i1">Chicken thighs — boneless skin-on<span class="item-note">2 thighs. Boneless skinless works too, you just lose the crispy skin.</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i2">
      <label for="i2">Baby bok choy<span class="item-note">2, halved lengthwise. Baby only — full size won't cook through.</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i3">
      <label for="i3">Jalapeño<span class="item-note">1, thinly sliced. Seeds in for heat, out for mild.</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i4">
      <label for="i4">Garlic<span class="item-note">2 cloves</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i5">
      <label for="i5">Gruyère<span class="item-note">45g, grated. Watch it under the broiler.</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i6">
      <label for="i6">Heavy cream<span class="item-note">3 tbsp needed</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i7">
      <label for="i7">Chicken broth<span class="item-note">2 tbsp needed — a small carton is fine</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i8">
      <label for="i8">Smoked paprika<span class="item-note">If you don't already have it</span></label>
    </div>
  </div>
</div>

<!-- DIVIDER -->
<div class="divider-label">Already Have — Check & Confirm</div>

<div class="section">
  <div class="section-header have">Dairy & Fats</div>
  <div class="item-list">
    <div class="item have-item">
      <input type="checkbox" id="h1">
      <label for="h1">Butter<span class="item-note">½ tbsp</span></label>
    </div>
    <div class="item have-item">
      <input type="checkbox" id="h2">
      <label for="h2">Olive oil<span class="item-note">1 tbsp</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header have">Pantry</div>
  <div class="item-list">
    <div class="item have-item">
      <input type="checkbox" id="h3">
      <label for="h3">Salt & pepper</label>
    </div>
  </div>
</div>

<script>
  const checkboxes = document.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach(cb => {
    if (localStorage.getItem('jgc-' + cb.id) === 'checked') cb.checked = true;
    cb.addEventListener('change', () => {
      localStorage.setItem('jgc-' + cb.id, cb.checked ? 'checked' : '');
    });
  });
</script>

</body>
</html>
