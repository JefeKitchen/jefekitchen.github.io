<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - Overnight Oats</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Overnight Oats</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="oo9"><label for="oo9">Blueberries or mixed berries</label></div>
    <div class="item"><input type="checkbox" id="oo10"><label for="oo10">Bananas</label></div>
    <div class="item"><input type="checkbox" id="oo11"><label for="oo11">Apples<span class="item-note">Good with cinnamon</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="oo2"><label for="oo2">Plain Greek yogurt<span class="item-note">About 2 1/2 cups</span></label></div>
    <div class="item"><input type="checkbox" id="oo3"><label for="oo3">Milk<span class="item-note">Dairy or non-dairy, about 2 1/2 cups</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Grains & Toppings</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="oo1"><label for="oo1">Old-fashioned rolled oats<span class="item-note">About 2 1/2 cups for 5 jars</span></label></div>
    <div class="item"><input type="checkbox" id="oo12"><label for="oo12">Granola or chopped nuts<span class="item-note">Keep separate until eating</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="oo5"><label for="oo5">Honey or maple syrup</label></div>
    <div class="item"><input type="checkbox" id="oo6"><label for="oo6">Vanilla extract</label></div>
    <div class="item"><input type="checkbox" id="oo4"><label for="oo4">Chia seeds<span class="item-note">Optional, helps thicken</span></label></div>
    <div class="item"><input type="checkbox" id="oo7"><label for="oo7">Cinnamon</label></div>
    <div class="item"><input type="checkbox" id="oo8"><label for="oo8">Peanut butter or almond butter<span class="item-note">Optional but good for protein and staying power</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Containers</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="oo13"><label for="oo13">5 jars or containers with lids</label></div>
  </div>
</div>

<script>
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    const key = `overnight-oats-${cb.id}`;
    cb.checked = localStorage.getItem(key) === 'checked';
    cb.addEventListener('change', () => localStorage.setItem(key, cb.checked ? 'checked' : ''));
  });
</script>
<script src="../grocery-boom.js"></script>
</body>
</html>
