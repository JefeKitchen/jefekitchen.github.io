<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f2f2f0;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: #111;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    color: #111;
    line-height: 1;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 24px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ddd;
  }

  .section-header {
    background: #111;
    padding: 9px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: #fff;
  }

  .item-list {
    padding: 6px 0;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .item:last-child { border-bottom: none; }

  .item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: #111;
    cursor: pointer;
  }

  .item label {
    font-size: 14.5px;
    color: #111;
    cursor: pointer;
    flex: 1;
    line-height: 1.4;
    pointer-events: none;
  }

  .item input[type="checkbox"]:checked ~ label {
    color: #aaa;
    text-decoration: line-through;
  }

  .item-note {
    font-size: 11.5px;
    color: #999;
    display: block;
    margin-top: 1px;
  }

</style>
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<style>.back-bar{position:sticky;top:0;z-index:1000;background:#171717;border-bottom:1px solid #2c2c2c;padding:4px 10px;}.back-bar a{color:#b8953a;text-decoration:none;font-family:-apple-system,sans-serif;font-size:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;}</style>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-sub">Game 7 · Sliders Only</div>

    </div>
  </div>
</div>

<script>
  const checkboxes = document.querySelectorAll('input[type="checkbox"]');

  // Restore saved state on load
  checkboxes.forEach(cb => {
    if (localStorage.getItem(cb.id) === 'checked') {
      cb.checked = true;
    }
  });

  // Save state on change
  checkboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      localStorage.setItem(cb.id, cb.checked ? 'checked' : '');
    });
  });
</script>

</body>
