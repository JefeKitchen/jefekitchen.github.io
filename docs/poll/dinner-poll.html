<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Snackie Poll</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --raised: #202020;
    --border: #2c2c2c;
    --gold: #b8953a;
    --green: #6f8f64;
    --red: #a4564b;
    --text: #ddd8cf;
    --muted: #77716a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  .back-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 4px 10px;
  }
  .back-bar a {
    color: var(--gold);
    text-decoration: none;
    font-size: 30px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 32px;
  }
  .hero {
    background: var(--surface);
    padding: 34px 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    font-weight: 600;
    line-height: 0.98;
  }
  .hero-title span { color: var(--gold); }
  .poll-list {
    padding: 18px 20px 20px;
  }
  .poll-row {
    align-items: stretch;
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr 48px;
    margin-bottom: 13px;
  }
  .poll-option {
    appearance: none;
    display: block;
    padding: 15px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    text-decoration: none;
    text-align: left;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .poll-option:active {
    background: var(--raised);
  }
  .poll-menu-link {
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    display: flex;
    font-size: 20px;
    justify-content: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .poll-menu-link:active {
    background: var(--raised);
  }
  .option-title {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
  }
  .poll-actions,
  .write-in-wrap,
  .results-panel {
    margin: 0 20px 14px;
  }
  .poll-actions {
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr 1fr;
  }
  .submit-vote,
  .results-toggle {
    appearance: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 12px;
  }
  .submit-vote {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #111;
  }
  .submit-vote:disabled {
    opacity: 0.45;
  }
  .results-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .write-in-wrap {
    display: none;
  }
  .write-in-wrap.is-open {
    display: block;
  }
  .write-in-wrap input {
    appearance: none;
    background: #101010;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 16px;
    padding: 11px 12px;
    width: 100%;
  }
  .vote-status {
    color: var(--muted);
    font-size: 12px;
    margin: -2px 20px 14px;
    min-height: 18px;
  }
  .results-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: none;
    padding: 12px;
  }
  .results-panel.is-open {
    display: block;
  }
  .result-row {
    display: grid;
    gap: 7px;
    margin-bottom: 11px;
  }
  .result-row:last-child {
    margin-bottom: 0;
  }
  .result-top {
    align-items: center;
    display: flex;
    gap: 10px;
    justify-content: space-between;
  }
  .result-name {
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.15;
  }
  .result-count {
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
  }
  .result-bar {
    background: #101010;
    border-radius: 999px;
    height: 6px;
    overflow: hidden;
  }
  .result-fill {
    background: var(--gold);
    border-radius: inherit;
    height: 100%;
    min-width: 0;
  }
  .results-empty {
    color: var(--muted);
    font-size: 13px;
  }

</style>
<link rel="stylesheet" href="../theme.css?v=4">
<style>
  .poll-option.is-selected {
    background: #211d14 !important;
    border-color: var(--gold) !important;
    color: var(--gold) !important;
  }
  .poll-option.is-selected .option-title {
    color: var(--gold) !important;
  }
</style>
<script type="module" src="../firebase-state.js?v=4"></script>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="hero">
  <div class="hero-title">WHAT<br><span>SNACKIE?</span></div>
</div>

<div class="poll-list">
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="spicy-honey-pretzel-snack-mix" data-choice="Spicy Honey Pretzel Snack Mix">
      <span>
        <span class="option-title">Spicy Honey Pretzel Snack Mix</span>
      </span>
    </button>
    <a class="poll-menu-link" href="./snackie-menus/spicy-honey-pretzel-snack-mix.html" aria-label="Spicy Honey Pretzel Snack Mix menu">📜</a>
  </div>
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="savory-roasted-edamame" data-choice="Savory Roasted Edamame">
      <span>
        <span class="option-title">Savory Roasted Edamame</span>
      </span>
    </button>
    <a class="poll-menu-link" href="./snackie-menus/savory-roasted-edamame.html" aria-label="Savory Roasted Edamame menu">📜</a>
  </div>
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="crunchy-ranch-chickpeas" data-choice="Crunchy Ranch Chickpeas">
      <span>
        <span class="option-title">Crunchy Ranch Chickpeas</span>
      </span>
    </button>
    <a class="poll-menu-link" href="./snackie-menus/crunchy-ranch-chickpeas.html" aria-label="Crunchy Ranch Chickpeas menu">📜</a>
  </div>
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="buffalo-ranch-snack-crackers" data-choice="Buffalo Ranch Snack Crackers">
      <span>
        <span class="option-title">Buffalo Ranch Snack Crackers</span>
      </span>
    </button>
    <a class="poll-menu-link" href="./snackie-menus/buffalo-ranch-snack-crackers.html" aria-label="Buffalo Ranch Snack Crackers menu">📜</a>
  </div>
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="sesame-soy-trail-mix" data-choice="Sesame Soy Trail Mix">
      <span>
        <span class="option-title">Sesame Soy Trail Mix</span>
      </span>
    </button>
    <a class="poll-menu-link" href="./snackie-menus/sesame-soy-trail-mix.html" aria-label="Sesame Soy Trail Mix menu">📜</a>
  </div>
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="chocolate-peanut-butter-protein-bites" data-choice="Chocolate Peanut Butter Protein Bites">
      <span>
        <span class="option-title">Chocolate Peanut Butter Protein Bites</span>
      </span>
    </button>
    <a class="poll-menu-link" href="./snackie-menus/chocolate-peanut-butter-protein-bites.html" aria-label="Chocolate Peanut Butter Protein Bites menu">📜</a>
  </div>
  <div class="poll-row">
    <button class="poll-option" type="button" data-choice-id="wildcard" data-choice="Wildcard" data-write-in="true">
      <span>
        <span class="option-title">Wildcard</span>
      </span>
    </button>
  </div>
</div>

<div class="write-in-wrap" id="writeInWrap">
  <input id="writeInInput" type="text" autocomplete="off" placeholder="Nominate a snackie">
</div>

<div class="poll-actions">
  <button class="submit-vote" type="button" id="submitVote" disabled>Submit Vote</button>
  <button class="results-toggle" type="button" id="resultsToggle">Results</button>
</div>
<div class="vote-status" id="voteStatus"></div>
<div class="results-panel" id="resultsPanel"></div>

<script>
  const pollOptions = Array.from(document.querySelectorAll('.poll-option'));
  const submitVote = document.getElementById('submitVote');
  const resultsToggle = document.getElementById('resultsToggle');
  const resultsPanel = document.getElementById('resultsPanel');
  const voteStatus = document.getElementById('voteStatus');
  const writeInWrap = document.getElementById('writeInWrap');
  const writeInInput = document.getElementById('writeInInput');
  let selectedOption = null;
  let votes = [];
  let unwatchVotes = null;

  const optionLabel = option => option.dataset.writeIn ? (writeInInput.value.trim() || 'Wildcard') : option.dataset.choice;

  const selectOption = option => {
    selectedOption = option;
    pollOptions.forEach(candidate => candidate.classList.toggle('is-selected', candidate === option));
    writeInWrap.classList.toggle('is-open', !!option.dataset.writeIn);
    submitVote.disabled = false;
    voteStatus.textContent = '';
    if (option.dataset.writeIn) writeInInput.focus();
  };

  const renderResults = () => {
    const counts = votes.reduce((totals, vote) => {
      const id = vote.choiceId || 'wildcard';
      totals[id] = totals[id] || { choice: vote.choice || 'Wildcard', count: 0 };
      totals[id].count += 1;
      return totals;
    }, {});
    const rows = Object.entries(counts).map(([id, result]) => ({
      id,
      choice: result.choice,
      count: result.count
    }));
    const topCount = Math.max(1, ...rows.map(row => row.count));

    resultsPanel.innerHTML = '';
    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'results-empty';
      empty.textContent = 'No votes yet.';
      resultsPanel.appendChild(empty);
      return;
    }
    rows.forEach(row => {
      const result = document.createElement('div');
      result.className = 'result-row';
      const top = document.createElement('div');
      top.className = 'result-top';
      const name = document.createElement('div');
      name.className = 'result-name';
      name.textContent = row.choice;
      const count = document.createElement('div');
      count.className = 'result-count';
      count.textContent = `${row.count}`;
      top.append(name, count);
      const bar = document.createElement('div');
      bar.className = 'result-bar';
      const fill = document.createElement('div');
      fill.className = 'result-fill';
      fill.style.width = `${(row.count / topCount) * 100}%`;
      bar.appendChild(fill);
      result.append(top, bar);
      resultsPanel.appendChild(result);
    });
  };

  const startPollSync = () => {
    if (unwatchVotes || !window.KitchenCloud?.watchPollVotes) return;
    unwatchVotes = window.KitchenCloud.watchPollVotes(nextVotes => {
      votes = nextVotes;
      const mine = votes.find(vote => vote.voterId === window.KitchenCloud.currentUserId?.());
      if (mine && !selectedOption) {
        const previous = pollOptions.find(option => option.dataset.choiceId === mine.choiceId);
        if (previous) {
          selectOption(previous);
          if (previous.dataset.writeIn) writeInInput.value = mine.choice;
        }
      }
      renderResults();
    }, () => {
      voteStatus.textContent = 'Poll sync is unavailable right now.';
    });
  };

  pollOptions.forEach(option => {
    option.addEventListener('click', () => selectOption(option));
  });

  submitVote.addEventListener('click', async () => {
    if (!selectedOption) return;
    const choice = optionLabel(selectedOption);
    if (selectedOption.dataset.writeIn && !writeInInput.value.trim()) {
      voteStatus.textContent = 'Write in your snackie first.';
      writeInInput.focus();
      return;
    }
    submitVote.disabled = true;
    voteStatus.textContent = 'Saving vote...';
    try {
      await window.KitchenCloud.ensureSignedIn();
      await window.KitchenCloud.savePollVote({
        choiceId: selectedOption.dataset.choiceId,
        choice,
        writeIn: !!selectedOption.dataset.writeIn
      });
      voteStatus.textContent = 'Vote saved.';
    } catch (error) {
      console.warn('Poll vote save failed', error);
      voteStatus.textContent = 'Vote did not save. Try again?';
      submitVote.disabled = false;
      return;
    }
    submitVote.disabled = false;
  });

  resultsToggle.addEventListener('click', () => {
    resultsPanel.classList.toggle('is-open');
    renderResults();
  });

  window.addEventListener('kitchen-cloud-ready', startPollSync);
  startPollSync();
  renderResults();
</script>

</body>
</html>
