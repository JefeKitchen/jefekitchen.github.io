<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dinner Poll</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --raised: #202020;
    --border: #2c2c2c;
    --gold: #b8953a;
    --green: #6f8f64;
    --red: #a4564b;
    --text: #ddd8cf;
    --muted: #77716a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  .back-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 4px 10px;
  }
  .back-bar a {
    color: var(--gold);
    text-decoration: none;
    font-size: 30px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 32px;
  }
  .hero {
    background: var(--surface);
    padding: 34px 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    font-weight: 600;
    line-height: 0.98;
  }
  .hero-title span { color: var(--gold); }
  .poll-list {
    padding: 18px 20px 20px;
  }
  .poll-row {
    align-items: stretch;
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr 48px;
    margin-bottom: 13px;
  }
  .poll-option {
    display: block;
    padding: 15px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .poll-option:active {
    background: var(--raised);
  }
  .poll-menu-link {
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    display: flex;
    font-size: 20px;
    justify-content: center;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .poll-menu-link:active {
    background: var(--raised);
  }
  .option-title {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
  }

</style>
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="hero">
  <div class="hero-title">WHAT<br><span>DIN?</span></div>
</div>

<div class="poll-list">
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=Survey%20says%3A%20beef%20meatballs%20with%20buttered%20noodles." data-choice="beef meatballs with buttered noodles">
      <span>
        <span class="option-title">Beef Meatballs with Buttered Noodles</span>
      </span>
    </a>
    <a class="poll-menu-link" href="../beef-meatballs-buttered-noodles/beef-meatballs-buttered-noodles-menu.html" aria-label="Beef Meatballs with Buttered Noodles menu">📜</a>
  </div>
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=Survey%20says%3A%20chicken%20and%20mashed%20potato%20bowls." data-choice="chicken and mashed potato bowls">
      <span>
        <span class="option-title">Chicken & Mashed Potato Bowls</span>
      </span>
    </a>
    <a class="poll-menu-link" href="../chicken-mashed-potato-bowls/chicken-mashed-potato-bowls-menu.html" aria-label="Chicken & Mashed Potato Bowls menu">📜</a>
  </div>
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=Survey%20says%3A%20creamy%20orzo%20with%20chicken." data-choice="creamy orzo with chicken">
      <span>
        <span class="option-title">Creamy Orzo with Chicken</span>
      </span>
    </a>
    <a class="poll-menu-link" href="../creamy-orzo-chicken/creamy-orzo-chicken-menu.html" aria-label="Creamy Orzo with Chicken menu">📜</a>
  </div>
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=Survey%20says%3A%20baked%20salmon%20with%20rice%20and%20cucumber." data-choice="baked salmon with rice and cucumber">
      <span>
        <span class="option-title">Baked Salmon with Rice & Cucumber</span>
      </span>
    </a>
    <a class="poll-menu-link" href="../baked-salmon-rice-cucumber/baked-salmon-rice-cucumber-menu.html" aria-label="Baked Salmon with Rice & Cucumber menu">📜</a>
  </div>
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=Survey%20says%3A%20chicken%20pot%20pie%20rice%20skillet." data-choice="chicken pot pie rice skillet">
      <span>
        <span class="option-title">Chicken Pot Pie Rice Skillet</span>
      </span>
    </a>
    <a class="poll-menu-link" href="../chicken-pot-pie-rice-skillet/chicken-pot-pie-rice-skillet-menu.html" aria-label="Chicken Pot Pie Rice Skillet menu">📜</a>
  </div>
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=Survey%20says%3A%20mild%20chicken%20noodle%20bake." data-choice="mild chicken noodle bake">
      <span>
        <span class="option-title">Mild Chicken Noodle Bake</span>
      </span>
    </a>
    <a class="poll-menu-link" href="../mild-chicken-noodle-bake/mild-chicken-noodle-bake-menu.html" aria-label="Mild Chicken Noodle Bake menu">📜</a>
  </div>
  <div class="poll-row">
    <a class="poll-option" href="sms:?body=I%20reject%20the%20ballot%20and%20nominate%3A%20" data-write-in="true">
      <span>
        <span class="option-title">Wildcard</span>
      </span>
    </a>
  </div>
</div>

<script>
  const responses = [
    choice => `Survey says: ${choice}.`,
    choice => `I have consulted my heart and my belly, and they both request ${choice}.`,
    choice => `I am pleased to announce that my dinner instincts have chosen ${choice}.`,
    choice => `After careful deliberation, the council has selected ${choice}.`,
    choice => `My stomach has entered the chat and requested ${choice}.`,
    choice => `Tonight feels like ${choice}.`
  ];

  function smsLink(message) {
    const separator = /iP(ad|hone|od)/i.test(navigator.userAgent) ? '&' : '?';
    return `sms:${separator}body=${encodeURIComponent(message)}`;
  }

  document.querySelectorAll('.poll-option').forEach(option => {
    option.addEventListener('click', event => {
      event.preventDefault();
      if (option.dataset.writeIn) {
        window.location.href = smsLink('I reject the ballot and nominate: ');
        return;
      }
      const choice = option.dataset.choice;
      const response = responses[Math.floor(Math.random() * responses.length)](choice);
      window.location.href = smsLink(response);
    });
  });
</script>

</body>
</html>
