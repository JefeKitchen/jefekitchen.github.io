<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dinner Poll</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --raised: #202020;
    --border: #2c2c2c;
    --gold: #b8953a;
    --green: #6f8f64;
    --red: #a4564b;
    --text: #ddd8cf;
    --muted: #77716a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 0 60px;
  }
  .back-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 4px 10px;
  }
  .back-bar a {
    color: var(--gold);
    text-decoration: none;
    font-size: 30px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 32px;
  }
  .hero {
    background: var(--surface);
    padding: 34px 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    font-weight: 600;
    line-height: 0.98;
  }
  .hero-title span { color: var(--gold); }
  .poll-list {
    padding: 18px 20px 20px;
  }
  .poll-option {
    display: block;
    padding: 15px 14px;
    margin-bottom: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .poll-option:active {
    background: var(--raised);
  }
  .option-title {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
  }
  .option-note {
    display: block;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
    margin-top: 5px;
  }

</style>
<link rel="stylesheet" href="../theme.css?v=2">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="hero">
  <div class="hero-title">WHAT<br><span>DIN?</span></div>
</div>

<div class="poll-list">
  <a class="poll-option" href="sms:&body=Survey%20says%3A%20charcoal%20chicken." data-choice="charcoal chicken with the fancy horseradish sauce">
    <span>
      <span class="option-title">Charcoal Chicken</span>
      <span class="option-note">Creamy horseradish-Dijon broth sauce</span>
    </span>
  </a>
  <a class="poll-option" href="sms:&body=Survey%20says%3A%20grilled%20chicken%20sandwiches." data-choice="grilled chicken sandwiches">
    <span>
      <span class="option-title">Grilled Chicken Sandwiches</span>
      <span class="option-note">Horseradish broth jus</span>
    </span>
  </a>
  <a class="poll-option" href="sms:&body=Survey%20says%3A%20chicken%20and%20potatoes%20with%20horseradish%20gravy." data-choice="chicken and potatoes with horseradish gravy">
    <span>
      <span class="option-title">Chicken and Potatoes</span>
      <span class="option-note">Horseradish broth gravy</span>
    </span>
  </a>
  <a class="poll-option" href="sms:&body=Survey%20says%3A%20chicken%20skewers." data-choice="chicken skewers">
    <span>
      <span class="option-title">Chicken Skewers</span>
      <span class="option-note">Horseradish-Dijon glaze</span>
    </span>
  </a>
  <a class="poll-option" href="sms:&body=I%20reject%20the%20ballot%20and%20nominate%3A%20" data-write-in="true">
    <span>
      <span class="option-title">Wildcard</span>
      <span class="option-note">Write in your own dinner pick</span>
    </span>
  </a>
</div>

<script>
  const responses = [
    choice => `Survey says: ${choice}.`,
    choice => `I have consulted my heart and my stomach, and they both request ${choice}.`,
    choice => `I am pleased to announce that my dinner instincts have chosen ${choice}.`,
    choice => `After careful deliberation, I am emotionally prepared for ${choice}.`,
    choice => `My stomach has entered the chat and requested ${choice}.`,
    choice => `Tonight feels like a ${choice} night.`
  ];

  document.querySelectorAll('.poll-option').forEach(option => {
    option.addEventListener('click', event => {
      event.preventDefault();
      if (option.dataset.writeIn) {
        window.location.href = 'sms:&body=I%20reject%20the%20ballot%20and%20nominate%3A%20';
        return;
      }
      const choice = option.dataset.choice;
      const response = responses[Math.floor(Math.random() * responses.length)](choice);
      window.location.href = `sms:&body=${encodeURIComponent(response)}`;
    });
  });
</script>

</body>
</html>
