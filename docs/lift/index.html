<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0d;
    --surface: #17191b;
    --raised: #232629;
    --line: #373b40;
    --accent: #ff7a45;
    --accent-2: #b9b3aa;
    --text: #f4f2ee;
    --muted: #96928b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
      radial-gradient(circle at 18% 0%, rgba(255, 122, 69, .14), transparent 30%),
      radial-gradient(circle at 90% 22%, rgba(120, 115, 108, .16), transparent 34%),
      var(--bg);
    background-size: 28px 28px, 28px 28px, auto, auto;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0 auto;
    max-width: 520px;
    min-height: 100vh;
    padding: 0 0 56px;
  }
  .back-bar {
    background: rgba(9, 11, 15, .86);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px);
    padding: 4px 10px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .back-bar a {
    align-items: center;
    color: var(--accent);
    display: inline-flex;
    font-family: -apple-system, sans-serif;
    font-size: 30px;
    height: 32px;
    justify-content: center;
    line-height: 1;
    text-decoration: none;
    width: 36px;
  }
  .hero {
    padding: 34px 22px 24px;
  }
  .eyebrow {
    color: var(--accent-2);
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: .95;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }
  .section-label {
    align-items: center;
    color: var(--muted);
    font-family: 'Roboto Mono', monospace;
    display: flex;
    font-size: 10px;
    font-weight: 700;
    gap: 10px;
    letter-spacing: 3px;
    margin: 22px 22px 9px;
    text-transform: uppercase;
  }
  .section-label::after {
    background: var(--line);
    content: '';
    flex: 1;
    height: 1px;
  }
  .workout-list {
    display: grid;
    gap: 10px;
    margin: 0 18px;
  }
  .workout-card {
    align-items: center;
    background:
      linear-gradient(135deg, rgba(255, 122, 69, .13), rgba(130, 124, 114, .08)),
      var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .24);
    color: var(--text);
    display: flex;
    gap: 14px;
    min-height: 86px;
    padding: 15px 16px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .workout-card:active { filter: brightness(1.12); }
  .workout-copy { flex: 1; min-width: 0; }
  .workout-kicker {
    color: var(--accent-2);
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .workout-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.4px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .workout-meta {
    color: var(--muted);
    display: block;
    font-size: 12px;
    letter-spacing: .4px;
    margin-top: 3px;
  }
  .workout-mark {
    align-items: center;
    background: var(--raised);
    border: 1px solid rgba(255, 122, 69, .34);
    border-radius: 12px;
    color: var(--accent);
    display: inline-flex;
    flex: 0 0 auto;
    font-size: 22px;
    height: 42px;
    justify-content: center;
    width: 42px;
  }
  @media (min-width: 760px) {
    body {
      max-width: 920px;
      padding: 24px 28px 72px;
    }
    .back-bar {
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 18px;
      position: static;
    }
    .hero {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 30px 32px;
    }
    h1 { font-size: 68px; }
    .workout-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 0;
    }
    .section-label { margin-left: 0; margin-right: 0; }
  }
</style>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<header class="hero">
  <div class="eyebrow">Prototype</div>
  <h1>Lift<span> Log</span></h1>
</header>

<div class="section-label">Workouts</div>
<main class="workout-list">
  <a class="workout-card" href="./chest-tri.html">
    <div class="workout-copy">
      <div class="workout-kicker">Push Day</div>
      <div class="workout-title">Chest &amp; Tri</div>
      <span class="workout-meta">Bench · Incline · Cable · Finishers</span>
    </div>
    <div class="workout-mark" aria-hidden="true">↗</div>
  </a>
  <a class="workout-card" href="./upper-body-today.html">
    <div class="workout-copy">
      <div class="workout-kicker">Today</div>
      <div class="workout-title">Upper Body</div>
      <span class="workout-meta">Medium · Full upper · Timer mode</span>
    </div>
    <div class="workout-mark" aria-hidden="true">▶</div>
  </a>
</main>
</body>
</html>
