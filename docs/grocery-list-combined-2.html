<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Combined Grocery List</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f2f2f0;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: #111;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    color: #111;
    line-height: 1;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 28px;
  }
  .section {
    margin-bottom: 16px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ddd;
  }
  .section-header {
    padding: 9px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
  }
  .section-header.need { background: #111; color: #fff; }
  .section-header.have { background: #888; color: #fff; }
  .divider-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: #888;
    text-align: center;
    margin: 28px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .divider-label::before,
  .divider-label::after { content: ''; flex: 1; height: 1px; background: #ccc; }
  .item-list { padding: 6px 0; }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: #111;
    cursor: pointer;
  }
  .item.have-item input[type="checkbox"] { accent-color: #888; }
  .item label {
    font-size: 14.5px;
    color: #111;
    cursor: pointer;
    flex: 1;
    line-height: 1.4;
    pointer-events: none;
  }
  .item input[type="checkbox"]:checked ~ label {
    color: #aaa;
    text-decoration: line-through;
  }
  .item-note {
    font-size: 11.5px;
    color: #999;
    display: block;
    margin-top: 1px;
  }
  .meal-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #bbb;
    display: block;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="page-title">Grocery List</div>
<div class="page-sub">Jalapeño Gruyère Chicken · Teriyaki Spread</div>

<!-- MEAT -->
<div class="section">
  <div class="section-header need">Meat</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i1">
      <label for="i1">Chicken thighs — boneless skin-on<span class="item-note">2 thighs</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i2">
      <label for="i2">Chicken thighs — boneless skinless<span class="item-note">6 thighs for 3 people</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
  </div>
</div>

<!-- PRODUCE -->
<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i3">
      <label for="i3">Baby bok choy<span class="item-note">2, halved lengthwise. Baby only.</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i4">
      <label for="i4">Jalapeño<span class="item-note">1, thinly sliced</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i5">
      <label for="i5">Garlic<span class="item-note">5 cloves total — 2 for Jalapeño Gruyère, 3 for Teriyaki</span><span class="meal-tag">Both Meals</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i6">
      <label for="i6">Fresh pineapple<span class="item-note">1 whole — juice and chunks for teriyaki, pieces for cucumber bites</span><span class="meal-tag">Teriyaki Spread</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i7">
      <label for="i7">Orange<span class="item-note">1 — juice goes into teriyaki sauce</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i8">
      <label for="i8">English cucumber<span class="item-note">1 — sliced into rounds for bites</span><span class="meal-tag">Cucumber Bites</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i9">
      <label for="i9">Fresh ginger<span class="item-note">Small piece — 1 tsp grated</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i10">
      <label for="i10">Fresh mint<span class="item-note">Optional garnish for cucumber bites</span><span class="meal-tag">Cucumber Bites</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i11">
      <label for="i11">Green onions<span class="item-note">Optional garnish for teriyaki</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
  </div>
</div>

<!-- DAIRY -->
<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i12">
      <label for="i12">Gruyère<span class="item-note">45g, grated. Watch it under the broiler.</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i13">
      <label for="i13">Heavy cream<span class="item-note">3 tbsp needed</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
  </div>
</div>

<!-- PANTRY -->
<div class="section">
  <div class="section-header need">Pantry & Canned</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="i14">
      <label for="i14">Chicken broth<span class="item-note">Small carton — 2 tbsp for Jalapeño Gruyère Chicken</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i15">
      <label for="i15">Coconut milk<span class="item-note">1 can (13.5 oz)</span><span class="meal-tag">Coconut Rice</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i16">
      <label for="i16">Jasmine rice<span class="item-note">1.5 cups needed for 3 people</span><span class="meal-tag">Coconut Rice</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i17">
      <label for="i17">Soy sauce<span class="item-note">¼ cup needed</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i18">
      <label for="i18">Cornstarch<span class="item-note">For thickening the teriyaki sauce</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i19">
      <label for="i19">Sesame seeds<span class="item-note">Optional garnish</span><span class="meal-tag">Teriyaki Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i20">
      <label for="i20">Smoked paprika<span class="item-note">If you don't already have it</span><span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="i21">
      <label for="i21">Reese's Puffs cereal</label>
    </div>
    <div class="item">
      <input type="checkbox" id="i22">
      <label for="i22">Coffee Mate creamer<span class="item-note">Original / regular</span></label>
    </div>
  </div>
</div>

<!-- DIVIDER -->
<div class="divider-label">Already Have — Check & Confirm</div>

<div class="section">
  <div class="section-header have">Condiments & Pantry</div>
  <div class="item-list">
    <div class="item have-item">
      <input type="checkbox" id="h1">
      <label for="h1">Honey<span class="meal-tag">Both Meals</span></label>
    </div>
    <div class="item have-item">
      <input type="checkbox" id="h2">
      <label for="h2">Olive oil<span class="meal-tag">Both Meals</span></label>
    </div>
    <div class="item have-item">
      <input type="checkbox" id="h3">
      <label for="h3">Salt & pepper<span class="meal-tag">Both Meals</span></label>
    </div>
    <div class="item have-item">
      <input type="checkbox" id="h4">
      <label for="h4">Sugar<span class="item-note">Pinch for coconut rice</span><span class="meal-tag">Coconut Rice</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header have">Dairy & Fats</div>
  <div class="item-list">
    <div class="item have-item">
      <input type="checkbox" id="h5">
      <label for="h5">Butter<span class="meal-tag">Jalapeño Gruyère Chicken</span></label>
    </div>
  </div>
</div>

<script>
  const checkboxes = document.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach(cb => {
    if (localStorage.getItem('combined2-' + cb.id) === 'checked') cb.checked = true;
    cb.addEventListener('change', () => {
      localStorage.setItem('combined2-' + cb.id, cb.checked ? 'checked' : '');
    });
  });
</script>

</body>
</html>
