<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - This Week</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
<style>
  .recipe-subhead {
    background: #141414;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.4px;
    padding: 8px 14px 6px;
    text-transform: uppercase;
  }
  .cart-boom {
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    position: fixed;
    z-index: 3000;
  }
  .boom-pop {
    animation: boom-pop 900ms ease-out forwards;
    filter: drop-shadow(0 0 14px rgba(184, 149, 58, .65));
    font-size: 42px;
    left: var(--x);
    opacity: 0;
    position: absolute;
    top: var(--y);
    transform: translate(-50%, -50%) scale(.4);
  }
  .boom-note {
    animation: boom-note 1800ms ease-out forwards;
    background: #171717;
    border: 1px solid #b8953a;
    border-radius: 8px;
    bottom: 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .42);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    left: 20px;
    padding: 14px 16px;
    position: fixed;
    right: 20px;
    text-align: center;
  }
  @keyframes boom-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(-14deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(8deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.7) rotate(18deg); }
  }
  @keyframes boom-note {
    0% { opacity: 0; transform: translateY(18px); }
    16%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(10px); }
  }
</style>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Meatloaf · Carnitas Elote Bowls</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="recipe-subhead">Meatloaf</div>
    <div class="item"><input type="checkbox" id="tw1"><label for="tw1">Potatoes<span class="item-note">1.5 lb Yukon Gold or russet, for green onion mash</span></label></div>
    <div class="item"><input type="checkbox" id="tw2"><label for="tw2">Yellow or white onion<span class="item-note">1 small, for the loaf</span></label></div>
    <div class="item"><input type="checkbox" id="tw3"><label for="tw3">Green onions<span class="item-note">About 3, for mashed potatoes</span></label></div>
    <div class="item"><input type="checkbox" id="tw4"><label for="tw4">Green beans<span class="item-note">About 12 oz</span></label></div>
    <div class="item"><input type="checkbox" id="tw5"><label for="tw5">Garlic<span class="item-note">1 clove, for green beans</span></label></div>
    <div class="item"><input type="checkbox" id="tw6"><label for="tw6">Lemon<span class="item-note">Optional tiny squeeze for green beans</span></label></div>
    <div class="recipe-subhead">Carnitas Elote Bowls</div>
    <div class="item"><input type="checkbox" id="tw19"><label for="tw19">Limes<span class="item-note">2-3, for rice, elote, and finishing</span></label></div>
    <div class="item"><input type="checkbox" id="tw20"><label for="tw20">Cilantro<span class="item-note">1 bunch</span></label></div>
    <div class="item"><input type="checkbox" id="tw21"><label for="tw21">Green onions<span class="item-note">1 bunch</span></label></div>
    <div class="item"><input type="checkbox" id="tw22"><label for="tw22">Avocado<span class="item-note">1-2</span></label></div>
    <div class="item"><input type="checkbox" id="tw23"><label for="tw23">Shredded cabbage or slaw mix<span class="item-note">Small bag or half a small head</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Meat</div>
  <div class="item-list">
    <div class="recipe-subhead">Meatloaf</div>
    <div class="item"><input type="checkbox" id="tw7"><label for="tw7">Ground beef<span class="item-note">1.5 lb, 80/20 preferred</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list">
    <div class="recipe-subhead">Meatloaf</div>
    <div class="item"><input type="checkbox" id="tw8"><label for="tw8">Milk<span class="item-note">About 1/2 cup total for loaf and potatoes</span></label></div>
    <div class="item"><input type="checkbox" id="tw9"><label for="tw9">Eggs<span class="item-note">1 large egg</span></label></div>
    <div class="item"><input type="checkbox" id="tw10"><label for="tw10">Butter<span class="item-note">About 5 tbsp total</span></label></div>
    <div class="recipe-subhead">Carnitas Elote Bowls</div>
    <div class="item"><input type="checkbox" id="tw24"><label for="tw24">Cotija<span class="item-note">About 1/2 cup crumbled</span></label></div>
    <div class="item"><input type="checkbox" id="tw25"><label for="tw25">Sour cream or crema<span class="item-note">About 1/4 cup</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="recipe-subhead">Meatloaf</div>
    <div class="item"><input type="checkbox" id="tw11"><label for="tw11">Plain breadcrumbs<span class="item-note">1/2 cup</span></label></div>
    <div class="item"><input type="checkbox" id="tw12"><label for="tw12">Ketchup<span class="item-note">1/3 cup for glaze</span></label></div>
    <div class="item"><input type="checkbox" id="tw13"><label for="tw13">Dijon mustard<span class="item-note">2 tbsp total</span></label></div>
    <div class="item"><input type="checkbox" id="tw14"><label for="tw14">Worcestershire sauce<span class="item-note">1 tbsp total</span></label></div>
    <div class="item"><input type="checkbox" id="tw15"><label for="tw15">Prepared horseradish<span class="item-note">1-2 tsp for glaze</span></label></div>
    <div class="item"><input type="checkbox" id="tw16"><label for="tw16">Brown sugar or honey<span class="item-note">1 tbsp for glaze</span></label></div>
    <div class="item"><input type="checkbox" id="tw17"><label for="tw17">Garlic powder<span class="item-note">1/2 tsp</span></label></div>
    <div class="item"><input type="checkbox" id="tw18"><label for="tw18">Kosher salt and black pepper</label></div>
    <div class="recipe-subhead">Carnitas Elote Bowls</div>
    <div class="item"><input type="checkbox" id="tw26"><label for="tw26">Rice<span class="item-note">1 cup dry white rice</span></label></div>
    <div class="item"><input type="checkbox" id="tw27"><label for="tw27">Corn<span class="item-note">2 cups frozen corn or 1 large can, drained</span></label></div>
    <div class="item"><input type="checkbox" id="tw28"><label for="tw28">Mayo<span class="item-note">About 2 tbsp</span></label></div>
    <div class="item"><input type="checkbox" id="tw29"><label for="tw29">Chili powder<span class="item-note">About 1/2 tsp</span></label></div>
    <div class="item"><input type="checkbox" id="tw30"><label for="tw30">Hot sauce<span class="item-note">For finishing</span></label></div>
    <div class="item"><input type="checkbox" id="tw31"><label for="tw31">Tortilla chips<span class="item-note">Optional crunch</span></label></div>
  </div>
</div>

<script>
  const checkboxes = Array.from(document.querySelectorAll('input[type="checkbox"]'));
  let wasComplete = false;

  const isComplete = () => checkboxes.length > 0 && checkboxes.every(cb => cb.checked);

  const showCartBoom = () => {
    document.querySelector('.cart-boom')?.remove();
    const boom = document.createElement('div');
    boom.className = 'cart-boom';
    [
      ['18%', '18%'],
      ['78%', '20%'],
      ['50%', '34%'],
      ['24%', '58%'],
      ['76%', '62%'],
      ['48%', '78%']
    ].forEach(([x, y], index) => {
      const pop = document.createElement('span');
      pop.className = 'boom-pop';
      pop.textContent = '💥';
      pop.style.setProperty('--x', x);
      pop.style.setProperty('--y', y);
      pop.style.animationDelay = `${index * 85}ms`;
      boom.appendChild(pop);
    });
    const note = document.createElement('div');
    note.className = 'boom-note';
    note.textContent = 'Groceries acquired.';
    boom.appendChild(note);
    document.body.appendChild(boom);
    window.setTimeout(() => boom.remove(), 2200);
  };

  checkboxes.forEach(cb => {
    const key = `this-week-${cb.id}`;
    cb.checked = localStorage.getItem(key) === 'checked';
    cb.addEventListener('change', () => {
      localStorage.setItem(key, cb.checked ? 'checked' : '');
      const complete = isComplete();
      if (complete && !wasComplete) showCartBoom();
      wasComplete = complete;
    });
  });

  wasComplete = isComplete();
</script>
</body>
</html>
