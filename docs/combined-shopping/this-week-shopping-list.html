<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - This Week</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
<style>
  .recipe-subhead {
    align-items: center;
    background: #141414;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    display: flex;
    font-size: 10px;
    font-weight: 600;
    justify-content: space-between;
    letter-spacing: 1.4px;
    padding: 8px 14px 6px;
    text-transform: uppercase;
  }
  .cart-boom {
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    position: fixed;
    z-index: 3000;
  }
  .boom-pop {
    animation: boom-pop 900ms ease-out forwards;
    filter: drop-shadow(0 0 14px rgba(184, 149, 58, .65));
    font-size: 42px;
    left: var(--x);
    opacity: 0;
    position: absolute;
    top: var(--y);
    transform: translate(-50%, -50%) scale(.4);
  }
  .boom-note {
    animation: boom-note 1800ms ease-out forwards;
    background: #171717;
    border: 1px solid #b8953a;
    border-radius: 8px;
    bottom: 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .42);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    left: 20px;
    padding: 14px 16px;
    position: fixed;
    right: 20px;
    text-align: center;
  }
  .remove-toast {
    background: #171717;
    border: 1px solid var(--border);
    border-radius: 999px;
    bottom: 18px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, .36);
    color: var(--muted);
    font-size: 13px;
    left: 20px;
    padding: 9px 12px;
    position: fixed;
    right: 20px;
    text-align: center;
    z-index: 2500;
  }
  .section-header {
    align-items: center !important;
    display: flex !important;
    justify-content: space-between !important;
  }
  .list-toolbar {
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr;
    margin: 14px 20px 0;
  }
  .meal-filter {
    border-top: 1px solid var(--border);
    display: none;
    margin: 12px 20px 0;
    padding-top: 10px;
  }
  .meal-filter.is-visible {
    display: block;
  }
  .meal-filter-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .meal-filter-btn {
    appearance: none;
    background: #181818;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--gold);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 10px;
    -webkit-tap-highlight-color: transparent;
  }
  .meal-filter-btn.is-off {
    background: #181818;
    border-color: var(--border);
    color: var(--muted);
    opacity: 0.58;
  }
  .meal-filter-btn:active {
    border-color: var(--gold);
    color: var(--gold);
  }
  .page-title .accent {
    color: var(--gold);
  }
  .top-add-btn {
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 14px;
    text-align: left;
    width: 100%;
  }
  .top-add-btn:active {
    border-color: var(--gold);
    color: var(--gold);
  }
  .add-item-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: none;
    gap: 8px;
    margin: 8px 20px 0;
    padding: 10px;
  }
  .add-item-form.is-open {
    display: grid;
  }
  .add-item-form input,
  .add-item-form select {
    appearance: none;
    background: #101010;
    border: 1px solid var(--border);
    border-radius: 5px;
    box-sizing: border-box;
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 16px;
    padding: 10px;
    width: 100%;
  }
  .form-actions {
    display: grid;
    gap: 8px;
    grid-template-columns: 1fr 1fr;
  }
  .form-actions button {
    appearance: none;
    border-radius: 5px;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
  }
  .save-item-btn {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #111;
  }
  .cancel-item-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .trip-toolbar {
    margin: 8px 20px 0;
  }
  .complete-trip-btn {
    appearance: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    text-align: left;
    width: 100%;
  }
  .complete-trip-btn {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #111;
  }
  .complete-trip-btn:active {
    filter: brightness(1.08);
  }
  .complete-trip-btn:disabled {
    background: var(--surface);
    border-color: var(--border);
    color: var(--muted);
    cursor: default;
    opacity: 0.55;
  }
  .complete-trip-btn:disabled:active {
    filter: none;
  }
  .reset-list-footer {
    margin: 16px 20px 20px;
    text-align: center;
  }
  .reset-list-btn {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 10px;
    text-transform: uppercase;
  }
  .reset-list-btn:active {
    border-color: var(--gold);
    color: var(--gold);
  }
  .add-item-btn {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
  }
  .add-item-btn {
    font-size: 18px;
    line-height: 1;
    margin: -4px -4px -4px 8px;
    padding: 4px 8px;
  }
  .add-item-btn:active {
    color: var(--gold);
  }
  .section .item {
    padding: 10px 14px !important;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .section .item * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .section .item .item-note {
    background: #202020 !important;
    border: 1px solid var(--border) !important;
    border-radius: 999px !important;
    display: inline-flex !important;
    font-size: 11px !important;
    line-height: 1.2 !important;
    margin: 0 0 0 7px !important;
    padding: 2px 7px !important;
    vertical-align: 1px !important;
    white-space: normal !important;
  }
  .section .item .item-note-list {
    display: inline-flex !important;
    flex-wrap: wrap !important;
    gap: 4px !important;
    margin: 0 0 0 7px !important;
    vertical-align: 1px !important;
  }
  .section .item .item-note-list .item-note {
    margin: 0 !important;
  }
  @keyframes boom-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(-14deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(8deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.7) rotate(18deg); }
  }
  @keyframes boom-note {
    0% { opacity: 0; transform: translateY(18px); }
    16%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(10px); }
  }
</style>
<script src="../recipe-catalog.js?v=1"></script>
<script src="../recipe-serving-data.js?v=1"></script>
<script src="../quantity-scaler.js?v=1"></script>
<script type="module" src="../firebase-state.js?v=4"></script>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery <span class="accent">List</span></div>

<div class="list-toolbar">
  <button class="top-add-btn" type="button" id="addIngredient">+ Add Item</button>
</div>

<form class="add-item-form" id="addIngredientForm">
  <input id="newItemText" type="text" autocomplete="off" placeholder="Item">
  <select id="newItemSection" aria-label="Section"></select>
  <div class="form-actions">
    <button class="save-item-btn" type="submit">Add</button>
    <button class="cancel-item-btn" type="button" id="cancelAddItem">Cancel</button>
  </div>
</form>

<div class="trip-toolbar">
  <button class="complete-trip-btn" type="button" id="completeShoppingTrip">Complete Shopping Trip</button>
</div>

<div class="meal-filter" id="mealFilter">
  <div class="meal-filter-list" id="mealFilterList"></div>
</div>

<div id="shoppingSections"></div>

<div class="reset-list-footer">
  <button class="reset-list-btn" type="button" id="resetList">Reset List</button>
</div>

<script>
  const addedItemsKey = 'this-week-added-items-v2';
  const selectedRecipesKey = 'this-week-shopping-recipes-v1';
  const purchasedItemsKey = 'this-week-purchased-items-v1';
  const removedItemsKey = 'this-week-removed-items-v1';
  const hiddenMealsKey = 'this-week-hidden-shopping-meals-v1';
  const defaultRecipeIds = [];
  const sectionOptions = window.JEFES_KITCHEN_CATALOG.shoppingSections;
  const recipeCatalog = window.JEFES_KITCHEN_CATALOG.recipes;
  const servingData = window.JEFES_RECIPE_SERVINGS || {};

  const servingInfo = recipe => {
    const info = servingData[recipe.id] || {};
    const servingType = info.servingType || (recipe.section === 'snackies' ? 'servings' : 'people');
    return {
      baseServings: Number(info.baseServings || (servingType === 'servings' ? 4 : 2)),
      defaultServings: Number(info.defaultServings || (servingType === 'servings' ? 8 : 2)),
      servingType
    };
  };

  const normalizeServingCount = (recipe, value) => {
    const info = servingInfo(recipe);
    const parsed = Number(value);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : info.defaultServings;
  };

  const servingFactor = (recipe, entry) => {
    const info = servingInfo(recipe);
    return normalizeServingCount(recipe, entry.servings) / info.baseServings;
  };

  const scaleItemText = (text, factor) => window.KitchenQuantityScaler?.scaleQuantityText
    ? window.KitchenQuantityScaler.scaleQuantityText(text, factor)
    : text;

  const scaleItemNote = (note, factor) => window.KitchenQuantityScaler?.scaleStandaloneNote
    ? window.KitchenQuantityScaler.scaleStandaloneNote(note, factor)
    : note;
  const sectionAliases = {
    produce: 'Produce',
    dairy: 'Dairy',
    refrigerated: 'Refrigerated',
    fridge: 'Refrigerated',
    seafood: 'Meat/Seafood',
    meat: 'Meat/Seafood',
    'meat/seafood': 'Meat/Seafood',
    pantry: 'Pantry',
    snacks: 'Snacks',
    snack: 'Snacks',
    alcohol: 'Alcohol/Drinks',
    drinks: 'Alcohol/Drinks',
    drink: 'Alcohol/Drinks',
    'alcohol/drinks': 'Alcohol/Drinks',
    misc: 'Misc',
    other: 'Misc'
  };
  const sectionsRoot = document.getElementById('shoppingSections');
  const mealFilter = document.getElementById('mealFilter');
  const mealFilterList = document.getElementById('mealFilterList');
  const addIngredient = document.getElementById('addIngredient');
  const addIngredientForm = document.getElementById('addIngredientForm');
  const newItemText = document.getElementById('newItemText');
  const newItemSection = document.getElementById('newItemSection');
  const cancelAddItem = document.getElementById('cancelAddItem');
  const completeShoppingTrip = document.getElementById('completeShoppingTrip');
  const resetList = document.getElementById('resetList');
  let wasComplete = false;
  let cloudSelectedRecipes = null;
  let cloudAddedItems = null;
  let cloudPurchasedItems = null;
  let cloudSyncStarted = false;
  let unwatchCloudShopping = null;

  const getCheckboxes = () => Array.from(document.querySelectorAll('.item input[type="checkbox"]'));
  const isComplete = () => {
    const checkboxes = getCheckboxes();
    return checkboxes.length > 0 && checkboxes.every(cb => cb.checked);
  };
  const hasTripChanges = () => {
    return getCheckboxes().some(cb => cb.checked) || loadRemovedItems().size > 0;
  };
  const updateTripButtonState = () => {
    completeShoppingTrip.disabled = !hasTripChanges();
  };

  const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

  const loadAddedItems = () => {
    if (cloudAddedItems) return normalizeAddedItemsBySection(cloudAddedItems);

    try {
      return normalizeAddedItemsBySection(JSON.parse(localStorage.getItem(addedItemsKey)) || {});
    } catch {
      return {};
    }
  };

  const normalizeSelectedRecipes = raw => (Array.isArray(raw) ? raw : [])
    .map(entry => typeof entry === 'string' ? { id: entry } : entry)
    .filter(entry => recipeCatalog[entry.id])
    .map(entry => ({ ...entry, servings: normalizeServingCount(recipeCatalog[entry.id], entry.servings) }));

  const loadSelectedRecipes = () => {
    if (Array.isArray(cloudSelectedRecipes)) return normalizeSelectedRecipes(cloudSelectedRecipes);

    const raw = localStorage.getItem(selectedRecipesKey);
    if (raw === null) return normalizeSelectedRecipes(defaultRecipeIds);
    try {
      return normalizeSelectedRecipes(JSON.parse(raw));
    } catch {
      return normalizeSelectedRecipes(defaultRecipeIds);
    }
  };

  const loadPurchasedItems = () => {
    if (Array.isArray(cloudPurchasedItems)) return new Set(cloudPurchasedItems);

    try {
      return new Set(JSON.parse(localStorage.getItem(purchasedItemsKey)) || []);
    } catch {
      return new Set();
    }
  };

  const loadRemovedItems = () => {
    try {
      return new Set(JSON.parse(localStorage.getItem(removedItemsKey)) || []);
    } catch {
      return new Set();
    }
  };

  const loadHiddenMeals = () => {
    try {
      return new Set(JSON.parse(localStorage.getItem(hiddenMealsKey)) || []);
    } catch {
      return new Set();
    }
  };

  const saveAddedItems = items => localStorage.setItem(addedItemsKey, JSON.stringify(items));
  const saveSelectedRecipes = recipeIds => localStorage.setItem(selectedRecipesKey, JSON.stringify(recipeIds));
  const savePurchasedItems = items => localStorage.setItem(purchasedItemsKey, JSON.stringify([...items]));
  const saveRemovedItems = items => localStorage.setItem(removedItemsKey, JSON.stringify([...items]));
  const saveHiddenMeals = meals => localStorage.setItem(hiddenMealsKey, JSON.stringify([...meals]));

  const groupCloudItemsBySection = items => items.reduce((sections, item) => {
    const requestedSection = item.requestedSection || 'Misc';
    const sectionName = inferSectionForItem(item.text, requestedSection);
    sections[sectionName] = [...(sections[sectionName] || []), {
      id: item.id,
      text: item.text,
      requestedSection
    }];
    return sections;
  }, {});

  const startCloudSync = () => {
    if (cloudSyncStarted || !window.KitchenCloud) return;
    cloudSyncStarted = true;

    window.KitchenCloud.watchAuth(user => {
      if (unwatchCloudShopping) {
        unwatchCloudShopping();
        unwatchCloudShopping = null;
      }

      if (!user) {
        cloudSelectedRecipes = null;
        cloudAddedItems = null;
        cloudPurchasedItems = null;
        renderSections();
        return;
      }

      unwatchCloudShopping = window.KitchenCloud.watchShopping(snapshot => {
        cloudSelectedRecipes = normalizeSelectedRecipes(snapshot.recipes);
        cloudAddedItems = groupCloudItemsBySection(snapshot.customItems);
        cloudPurchasedItems = snapshot.purchasedItems;
        saveSelectedRecipes(cloudSelectedRecipes);
        saveAddedItems(cloudAddedItems);
        savePurchasedItems(cloudPurchasedItems);
        renderSections();
      }, () => {
        cloudSelectedRecipes = null;
        cloudAddedItems = null;
        cloudPurchasedItems = null;
        renderSections();
      });
    });
  };

  const normalizeSection = value => {
    const clean = (value || '').trim().toLowerCase();
    return sectionAliases[clean] || sectionOptions.find(option => option.toLowerCase() === clean) || 'Misc';
  };

  const manualItemSections = {
    apple: 'Produce',
    apples: 'Produce',
    banana: 'Produce',
    bananas: 'Produce',
    cilantro: 'Produce',
    cucumber: 'Produce',
    cucumbers: 'Produce',
    garlic: 'Produce',
    ginger: 'Produce',
    lemon: 'Produce',
    lemons: 'Produce',
    lime: 'Produce',
    limes: 'Produce',
    mint: 'Produce',
    onion: 'Produce',
    onions: 'Produce',
    parsley: 'Produce',
    scallion: 'Produce',
    scallions: 'Produce',
    'green onion': 'Produce',
    'green onions': 'Produce',
    tomato: 'Produce',
    tomatoes: 'Produce',
    pita: 'Bakery',
    pitas: 'Bakery',
    'pita chips': 'Snacks',
    rice: 'Pantry',
    noodles: 'Pantry',
    pasta: 'Pantry'
  };
  let knownItemSections = null;

  const normalizeItemName = value => (value || '')
    .toLowerCase()
    .replace(/\([^)]*\)/g, ' ')
    .replace(/\b\d+([./-]\d+)?\b/g, ' ')
    .replace(/\b(about|bag|bottle|box|bunch|can|cans|clove|cloves|cup|cups|dry|fresh|frozen|head|jar|large|lb|lbs|medium|oz|package|pkg|small|tbsp|tsp)\b/g, ' ')
    .replace(/\b(optional|if using|for|to taste|as needed)\b/g, ' ')
    .replace(/[^a-z\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const singularizeItemName = value => value
    .split(' ')
    .map(word => word.endsWith('ies') && word.length > 4 ? `${word.slice(0, -3)}y` : word)
    .map(word => word.endsWith('s') && word.length > 3 ? word.slice(0, -1) : word)
    .join(' ');

  const addKnownItemSection = (map, name, section) => {
    const clean = normalizeItemName(name);
    if (!clean) return;
    map[clean] = section;
    map[singularizeItemName(clean)] = section;
  };

  const getKnownItemSections = () => {
    if (knownItemSections) return knownItemSections;

    knownItemSections = {};
    Object.entries(manualItemSections).forEach(([name, section]) => {
      addKnownItemSection(knownItemSections, name, section);
    });
    Object.values(recipeCatalog).forEach(recipe => {
      Object.entries(recipe.items || {}).forEach(([sectionName, items]) => {
        const section = normalizeSection(sectionName);
        items.forEach(([, text]) => addKnownItemSection(knownItemSections, text, section));
      });
    });
    return knownItemSections;
  };

  const inferSectionForItem = (text, selectedSection = 'Misc') => {
    const section = normalizeSection(selectedSection);
    if (section !== 'Misc') return section;

    const clean = normalizeItemName(text);
    const singular = singularizeItemName(clean);
    const known = getKnownItemSections();
    if (known[clean]) return known[clean];
    if (known[singular]) return known[singular];
    return section;
  };

  const normalizeAddedItemsBySection = itemsBySection => {
    return Object.entries(itemsBySection || {}).reduce((sections, [sectionName, items]) => {
      (items || []).forEach(item => {
        if (!item?.id || !item?.text) return;
        const requestedSection = item.requestedSection || 'Misc';
        const inferredSection = inferSectionForItem(item.text, requestedSection);
        sections[inferredSection] = [...(sections[inferredSection] || []), item];
      });
      return sections;
    }, {});
  };

  const closeForms = () => {
    addIngredientForm.classList.remove('is-open');
  };

  sectionOptions.forEach(sectionName => {
    const option = document.createElement('option');
    option.value = sectionName;
    option.textContent = sectionName;
    newItemSection.appendChild(option);
  });

  const showCartBoom = () => {
    document.querySelector('.cart-boom')?.remove();
    const boom = document.createElement('div');
    boom.className = 'cart-boom';
    [
      ['18%', '18%'],
      ['78%', '20%'],
      ['50%', '34%'],
      ['24%', '58%'],
      ['76%', '62%'],
      ['48%', '78%']
    ].forEach(([x, y], index) => {
      const pop = document.createElement('span');
      pop.className = 'boom-pop';
      pop.textContent = '💥';
      pop.style.setProperty('--x', x);
      pop.style.setProperty('--y', y);
      pop.style.animationDelay = `${index * 85}ms`;
      boom.appendChild(pop);
    });
    const note = document.createElement('div');
    note.className = 'boom-note';
    note.textContent = 'Groceries acquired.';
    boom.appendChild(note);
    document.body.appendChild(boom);
    window.setTimeout(() => boom.remove(), 2200);
  };

  const showRemoveToast = text => {
    document.querySelector('.remove-toast')?.remove();
    const toast = document.createElement('div');
    toast.className = 'remove-toast';
    toast.textContent = `Removed ${text}.`;
    document.body.appendChild(toast);
    window.setTimeout(() => toast.remove(), 1600);
  };

  const registerCheckbox = cb => {
    if (cb.dataset.registered) return;
    cb.dataset.registered = 'true';
    const key = `this-week-${cb.id}`;
    cb.checked = localStorage.getItem(key) === 'checked';
    cb.addEventListener('change', () => {
      localStorage.setItem(key, cb.checked ? 'checked' : '');
      const complete = isComplete();
      if (complete && !wasComplete) showCartBoom();
      wasComplete = complete;
      updateTripButtonState();
    });
  };

  const recipeItemsBySection = () => {
    const selectedRecipes = loadSelectedRecipes();
    const purchasedItems = loadPurchasedItems();
    const removedItems = loadRemovedItems();
    const hiddenMeals = loadHiddenMeals();
    return selectedRecipes.reduce((sections, entry) => {
      if (hiddenMeals.has(entry.id)) return sections;
      const recipe = recipeCatalog[entry.id];
      const factor = servingFactor(recipe, entry);
      Object.entries(recipe.items).forEach(([sectionName, items]) => {
        const normalizedSection = normalizeSection(sectionName);
        if ((entry.meal || '').toLowerCase() === 'lunch' && normalizedSection === 'Alcohol/Drinks') return;
        const visibleItems = items
          .map(([id, text, note]) => ({
            id: `tw-${entry.id}-${id}`,
            recipe: recipe.name,
            recipeId: entry.id,
            text: scaleItemText(text, factor),
            note: scaleItemNote(note, factor)
          }))
          .filter(item => !purchasedItems.has(item.id) && !removedItems.has(item.id));
        sections[normalizedSection] = [
          ...(sections[normalizedSection] || []),
          ...visibleItems
        ];
      });
      return sections;
    }, {});
  };

  const itemIdsForRecipe = entry => {
    const recipe = recipeCatalog[entry.id];
    if (!recipe) return [];
    return Object.entries(recipe.items).flatMap(([sectionName, items]) => {
      const normalizedSection = normalizeSection(sectionName);
      if ((entry.meal || '').toLowerCase() === 'lunch' && normalizedSection === 'Alcohol/Drinks') return [];
      return items.map(([id]) => `tw-${entry.id}-${id}`);
    });
  };

  const pruneCompletedRecipes = async (purchasedItems, removedItems) => {
    const selectedRecipes = loadSelectedRecipes();
    const completedRecipeIds = selectedRecipes
      .filter(entry => {
        const itemIds = itemIdsForRecipe(entry);
        return itemIds.length > 0 && itemIds.every(itemId => purchasedItems.has(itemId) || removedItems.has(itemId));
      })
      .map(entry => entry.id);

    if (!completedRecipeIds.length) return;

    const completedRecipeSet = new Set(completedRecipeIds);
    const nextRecipes = selectedRecipes.filter(entry => !completedRecipeSet.has(entry.id));
    cloudSelectedRecipes = Array.isArray(cloudSelectedRecipes) ? nextRecipes : cloudSelectedRecipes;
    saveSelectedRecipes(nextRecipes);

    const hiddenMeals = loadHiddenMeals();
    completedRecipeIds.forEach(recipeId => {
      hiddenMeals.delete(recipeId);
      itemIdsForRecipe({ id: recipeId }).forEach(itemId => {
        purchasedItems.delete(itemId);
        removedItems.delete(itemId);
        localStorage.removeItem(`this-week-${itemId}`);
        if (window.KitchenCloud?.isSignedIn?.()) {
          window.KitchenCloud.clearPurchasedItem(itemId).catch(error => {
            console.warn('Kitchen shopping sync purchased prune unavailable', error);
          });
        }
      });
      if (window.KitchenCloud?.isSignedIn?.()) {
        window.KitchenCloud.removeShoppingRecipe(recipeId).catch(error => {
          console.warn('Kitchen shopping sync recipe prune unavailable', error);
        });
      }
    });
    saveHiddenMeals(hiddenMeals);
  };

  const removeRecipe = async recipeId => {
    const selectedRecipes = loadSelectedRecipes().filter(entry => entry.id !== recipeId);
    cloudSelectedRecipes = Array.isArray(cloudSelectedRecipes) ? selectedRecipes : cloudSelectedRecipes;
    const purchasedItems = loadPurchasedItems();
    const removedItems = loadRemovedItems();
    saveSelectedRecipes(selectedRecipes);
    if (window.KitchenCloud?.isSignedIn?.()) {
      try {
        await window.KitchenCloud.removeShoppingRecipe(recipeId);
      } catch (error) {
        console.warn('Kitchen shopping sync remove unavailable; removing local recipe', error);
      }
    }
    const hiddenMeals = loadHiddenMeals();
    hiddenMeals.delete(recipeId);
    saveHiddenMeals(hiddenMeals);
    Object.values(recipeCatalog[recipeId]?.items || {}).flat().forEach(([id]) => {
      purchasedItems.delete(`tw-${recipeId}-${id}`);
      removedItems.delete(`tw-${recipeId}-${id}`);
      localStorage.removeItem(`this-week-tw-${recipeId}-${id}`);
      if (window.KitchenCloud?.isSignedIn?.()) {
        window.KitchenCloud.clearPurchasedItem(`tw-${recipeId}-${id}`).catch(error => {
          console.warn('Kitchen shopping sync purchased cleanup unavailable', error);
        });
      }
    });
    savePurchasedItems(purchasedItems);
    saveRemovedItems(removedItems);
    renderSections();
  };

  const completeTrip = async () => {
    const checked = getCheckboxes().filter(cb => cb.checked);
    const removedItems = loadRemovedItems();
    if (!checked.length && !removedItems.size) return;

    const purchasedItems = loadPurchasedItems();
    const addedItems = loadAddedItems();
    const removeAddedItem = itemId => {
      Object.keys(addedItems).forEach(sectionName => {
        addedItems[sectionName] = (addedItems[sectionName] || []).filter(item => item.id !== itemId);
        if (!addedItems[sectionName].length) delete addedItems[sectionName];
      });
    };
    const removeCloudAddedItem = itemId => {
      if (window.KitchenCloud?.isSignedIn?.()) {
        window.KitchenCloud.removeShoppingItem(itemId).catch(error => {
          console.warn('Kitchen shopping sync custom cleanup unavailable', error);
        });
      }
    };

    removedItems.forEach(itemId => {
      if (itemId.startsWith('tw-custom-')) {
        removeAddedItem(itemId);
        removeCloudAddedItem(itemId);
        localStorage.removeItem(`this-week-${itemId}`);
        return;
      }
      purchasedItems.add(itemId);
      localStorage.removeItem(`this-week-${itemId}`);
      if (window.KitchenCloud?.isSignedIn?.()) {
        window.KitchenCloud.markPurchased(itemId).catch(error => {
          console.warn('Kitchen shopping sync hidden item unavailable', error);
        });
      }
    });

    checked.forEach(cb => {
      localStorage.removeItem(`this-week-${cb.id}`);
      const row = cb.closest('.item');
      const itemIds = row?.dataset.itemIds ? JSON.parse(row.dataset.itemIds) : [cb.id];
      itemIds.forEach(itemId => localStorage.removeItem(`this-week-${itemId}`));
      if (cb.id.startsWith('tw-custom-')) {
        removeAddedItem(cb.id);
        removeCloudAddedItem(cb.id);
      } else {
        itemIds.forEach(itemId => {
          purchasedItems.add(itemId);
          if (window.KitchenCloud?.isSignedIn?.()) {
            window.KitchenCloud.markPurchased(itemId).catch(error => {
              console.warn('Kitchen shopping sync purchased item unavailable', error);
            });
          }
        });
      }
    });

    await pruneCompletedRecipes(purchasedItems, removedItems);
    saveAddedItems(addedItems);
    savePurchasedItems(purchasedItems);
    saveRemovedItems(new Set());
    renderSections();
  };

  const resetCurrentList = async () => {
    if (!window.confirm('Reset checked and removed items?')) return;

    getCheckboxes().forEach(cb => {
      cb.checked = false;
      localStorage.removeItem(`this-week-${cb.id}`);
    });
    localStorage.removeItem(removedItemsKey);
    saveHiddenMeals(new Set());

    showRemoveToast('list actions');
    renderSections();
  };

  const removeCustomItem = async (sectionName, item) => {
    const removedItems = loadRemovedItems();
    removedItems.add(item.id);
    saveRemovedItems(removedItems);
    localStorage.removeItem(`this-week-${item.id}`);
    renderSections();
  };

  const removePlannedItem = async item => {
    const removedItems = loadRemovedItems();
    (item.itemIds || [item.id]).forEach(itemId => {
      removedItems.add(itemId);
      localStorage.removeItem(`this-week-${itemId}`);
    });
    saveRemovedItems(removedItems);
    renderSections();
  };

  const attachHiddenRemove = (row, item, onRemove) => {
    let pressTimer = null;
    let removed = false;
    const clearPress = () => {
      if (pressTimer) window.clearTimeout(pressTimer);
      pressTimer = null;
    };
    const remove = event => {
      event.preventDefault();
      event.stopPropagation();
      if (removed) return;
      removed = true;
      clearPress();
      showRemoveToast(item.text);
      onRemove();
    };

    row.addEventListener('contextmenu', remove);
    row.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse') return;
      clearPress();
      removed = false;
      pressTimer = window.setTimeout(() => remove(event), 700);
    });
    row.addEventListener('touchstart', event => {
      clearPress();
      removed = false;
      pressTimer = window.setTimeout(() => remove(event), 700);
    }, { passive: false });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(eventName => {
      row.addEventListener(eventName, clearPress);
    });
    ['touchend', 'touchcancel', 'touchmove'].forEach(eventName => {
      row.addEventListener(eventName, clearPress);
    });
  };

  const createItemRow = (item, onRemove) => {
    const row = document.createElement('div');
    row.className = item.custom ? 'item custom-item' : 'item';
    if (item.custom) row.dataset.customId = item.id;
    if (item.itemIds?.length) row.dataset.itemIds = JSON.stringify(item.itemIds);

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = item.id;

    const label = document.createElement('label');
    label.htmlFor = item.id;
    label.textContent = item.text;
    if (item.recipeNotes?.length) {
      const noteList = document.createElement('span');
      noteList.className = 'item-note-list';
      item.recipeNotes.forEach(recipeNote => {
        const note = document.createElement('span');
        note.className = 'item-note';
        note.textContent = recipeNote;
        noteList.appendChild(note);
      });
      label.appendChild(noteList);
    } else if (item.note) {
      const note = document.createElement('span');
      note.className = 'item-note';
      note.textContent = item.note;
      label.appendChild(note);
    }

    row.append(checkbox, label);
    registerCheckbox(checkbox);
    if (onRemove) attachHiddenRemove(row, item, onRemove);
    return row;
  };

  const createCustomItem = (sectionName, item) => {
    return createItemRow({ ...item, custom: true }, () => removeCustomItem(sectionName, item));
  };

  const addCustomItem = async (sectionName, text) => {
    const requestedSection = normalizeSection(sectionName);
    const finalSection = inferSectionForItem(text, requestedSection);
    const addedItems = loadAddedItems();
    const item = {
      id: `tw-custom-${slugify(finalSection)}-${Date.now()}`,
      requestedSection,
      text
    };
    addedItems[finalSection] = [...(addedItems[finalSection] || []), item];
    saveAddedItems(addedItems);
    renderSections();

    if (window.KitchenCloud?.ensureSignedIn) {
      try {
        await window.KitchenCloud.ensureSignedIn();
        await window.KitchenCloud.saveShoppingItem({ ...item, section: finalSection });
        return;
      } catch (error) {
        console.warn('Kitchen shopping sync item save unavailable; keeping local item', error);
      }
    }
  };

  const openIngredientForm = preferredSection => {
    closeForms();
    newItemSection.value = normalizeSection(preferredSection || 'Misc');
    addIngredientForm.classList.add('is-open');
    newItemText.focus();
  };

  const mealFilterLabel = entry => {
    const recipe = recipeCatalog[entry.id];
    return recipe.name;
  };

  const renderMealFilters = () => {
    const selectedRecipes = loadSelectedRecipes();
    const hiddenMeals = loadHiddenMeals();
    mealFilterList.innerHTML = '';
    mealFilter.classList.toggle('is-visible', selectedRecipes.length > 0);

    selectedRecipes.forEach(entry => {
      const recipe = recipeCatalog[entry.id];
      if (!recipe) return;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'meal-filter-btn';
      button.classList.toggle('is-off', hiddenMeals.has(entry.id));
      button.setAttribute('aria-pressed', hiddenMeals.has(entry.id) ? 'false' : 'true');
      button.textContent = mealFilterLabel(entry);
      button.addEventListener('click', () => {
        const nextHiddenMeals = loadHiddenMeals();
        if (nextHiddenMeals.has(entry.id)) {
          nextHiddenMeals.delete(entry.id);
        } else {
          nextHiddenMeals.add(entry.id);
        }
        saveHiddenMeals(nextHiddenMeals);
        renderSections();
      });
      mealFilterList.appendChild(button);
    });
  };

  const createRecipeGroup = (items) => {
    const fragment = document.createDocumentFragment();
    const itemGroups = items.reduce((groups, item) => {
      const key = singularizeItemName(normalizeItemName(item.text));
      groups[key] = [...(groups[key] || []), item];
      return groups;
    }, {});
    const sharedItems = [];
    const individualItems = [];

    Object.values(itemGroups).forEach(group => {
      const recipeIds = [...new Set(group.map(item => item.recipeId))];
      if (recipeIds.length > 1) {
        sharedItems.push({
          id: `tw-shared-${slugify(group[0].text)}-${recipeIds.map(slugify).sort().join('-')}`,
          itemIds: group.map(item => item.id),
          recipeIds,
          recipe: 'Shared',
          text: group[0].text,
          recipeNotes: group.map(item => item.note ? `${item.recipe}: ${item.note}` : item.recipe)
        });
        return;
      }
      individualItems.push(...group);
    });

    if (sharedItems.length) {
      sharedItems
        .sort((a, b) => a.text.localeCompare(b.text))
        .forEach(item => fragment.appendChild(createItemRow(item, () => removePlannedItem(item))));
    }

    const itemsByRecipe = individualItems.reduce((groups, item) => {
      groups[item.recipe] = [...(groups[item.recipe] || []), item];
      return groups;
    }, {});

    Object.entries(itemsByRecipe)
      .sort(([a], [b]) => a.localeCompare(b))
      .forEach(([recipeName, recipeItems]) => {
      const subhead = document.createElement('div');
      subhead.className = 'recipe-subhead';
      const label = document.createElement('span');
      label.textContent = recipeName;
      subhead.appendChild(label);
      fragment.appendChild(subhead);
      recipeItems.forEach(item => fragment.appendChild(createItemRow(item, () => removePlannedItem(item))));
    });

    return fragment;
  };

  const createSection = (sectionName, planned, items) => {
    const section = document.createElement('div');
    section.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header need';

    const label = document.createElement('span');
    label.textContent = sectionName;

    const addButton = document.createElement('button');
    addButton.type = 'button';
    addButton.className = 'add-item-btn';
    addButton.setAttribute('aria-label', `Add item to ${sectionName}`);
    addButton.textContent = '+';
    addButton.addEventListener('click', () => openIngredientForm(sectionName));

    const list = document.createElement('div');
    list.className = 'item-list';
    items.forEach(item => list.appendChild(createCustomItem(sectionName, item)));
    if (planned.length) list.appendChild(createRecipeGroup(planned));

    header.append(label, addButton);
    section.append(header, list);
    return section;
  };

  const renderSections = () => {
    const addedItems = loadAddedItems();
    const recipeItems = recipeItemsBySection();
    const removedItems = loadRemovedItems();
    renderMealFilters();
    sectionsRoot.innerHTML = '';
    sectionOptions.forEach(sectionName => {
      const planned = recipeItems[sectionName] || [];
      const items = (addedItems[sectionName] || []).filter(item => item?.id && item?.text && !removedItems.has(item.id));
      if (!planned.length && !items.length) return;
      sectionsRoot.appendChild(createSection(sectionName, planned, items));
    });
    wasComplete = isComplete();
    updateTripButtonState();
  };

  addIngredient.addEventListener('click', () => openIngredientForm());
  cancelAddItem.addEventListener('click', () => {
    addIngredientForm.classList.remove('is-open');
    newItemText.value = '';
  });
  addIngredientForm.addEventListener('submit', async event => {
    event.preventDefault();
    const cleanText = newItemText.value.trim();
    if (!cleanText) return;
    await addCustomItem(normalizeSection(newItemSection.value), cleanText);
    newItemText.value = '';
    addIngredientForm.classList.remove('is-open');
  });
  completeShoppingTrip.addEventListener('click', completeTrip);
  resetList.addEventListener('click', resetCurrentList);
  window.addEventListener('kitchen-cloud-ready', startCloudSync);
  startCloudSync();
  renderSections();
</script>
</body>
</html>
