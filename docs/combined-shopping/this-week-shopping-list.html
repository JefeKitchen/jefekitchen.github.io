<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - This Week</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
<style>
  .recipe-subhead {
    background: #141414;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.4px;
    padding: 8px 14px 6px;
    text-transform: uppercase;
  }
  .cart-boom {
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    position: fixed;
    z-index: 3000;
  }
  .boom-pop {
    animation: boom-pop 900ms ease-out forwards;
    filter: drop-shadow(0 0 14px rgba(184, 149, 58, .65));
    font-size: 42px;
    left: var(--x);
    opacity: 0;
    position: absolute;
    top: var(--y);
    transform: translate(-50%, -50%) scale(.4);
  }
  .boom-note {
    animation: boom-note 1800ms ease-out forwards;
    background: #171717;
    border: 1px solid #b8953a;
    border-radius: 8px;
    bottom: 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .42);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    left: 20px;
    padding: 14px 16px;
    position: fixed;
    right: 20px;
    text-align: center;
  }
  .section-header {
    align-items: center !important;
    display: flex !important;
    justify-content: space-between !important;
  }
  .add-item-btn,
  .remove-item-btn {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
  }
  .add-item-btn {
    font-size: 18px;
    line-height: 1;
    margin: -4px -4px -4px 8px;
    padding: 4px 8px;
  }
  .add-item-btn:active,
  .remove-item-btn:active {
    color: var(--gold);
  }
  .remove-item-btn {
    flex-shrink: 0;
    font-size: 16px;
    line-height: 1;
    margin: -2px -4px -2px 4px;
    padding: 2px 4px;
  }
  @keyframes boom-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(-14deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(8deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.7) rotate(18deg); }
  }
  @keyframes boom-note {
    0% { opacity: 0; transform: translateY(18px); }
    16%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(10px); }
  }
</style>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Add items as needed</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list"></div>
</div>

<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list"></div>
</div>

<div class="section">
  <div class="section-header need">Refrigerated</div>
  <div class="item-list"></div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list"></div>
</div>

<div class="section">
  <div class="section-header need">Snacks</div>
  <div class="item-list"></div>
</div>

<div class="section">
  <div class="section-header need">Alcohol/Drinks</div>
  <div class="item-list"></div>
</div>

<div class="section">
  <div class="section-header need">Misc</div>
  <div class="item-list"></div>
</div>

<script>
  const addedItemsKey = 'this-week-added-items-v2';
  let wasComplete = false;

  const getCheckboxes = () => Array.from(document.querySelectorAll('input[type="checkbox"]'));
  const isComplete = () => {
    const checkboxes = getCheckboxes();
    return checkboxes.length > 0 && checkboxes.every(cb => cb.checked);
  };

  const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

  const loadAddedItems = () => {
    try {
      return JSON.parse(localStorage.getItem(addedItemsKey)) || {};
    } catch {
      return {};
    }
  };

  const saveAddedItems = items => localStorage.setItem(addedItemsKey, JSON.stringify(items));

  const showCartBoom = () => {
    document.querySelector('.cart-boom')?.remove();
    const boom = document.createElement('div');
    boom.className = 'cart-boom';
    [
      ['18%', '18%'],
      ['78%', '20%'],
      ['50%', '34%'],
      ['24%', '58%'],
      ['76%', '62%'],
      ['48%', '78%']
    ].forEach(([x, y], index) => {
      const pop = document.createElement('span');
      pop.className = 'boom-pop';
      pop.textContent = '💥';
      pop.style.setProperty('--x', x);
      pop.style.setProperty('--y', y);
      pop.style.animationDelay = `${index * 85}ms`;
      boom.appendChild(pop);
    });
    const note = document.createElement('div');
    note.className = 'boom-note';
    note.textContent = 'Groceries acquired.';
    boom.appendChild(note);
    document.body.appendChild(boom);
    window.setTimeout(() => boom.remove(), 2200);
  };

  const registerCheckbox = cb => {
    if (cb.dataset.registered) return;
    cb.dataset.registered = 'true';
    const key = `this-week-${cb.id}`;
    cb.checked = localStorage.getItem(key) === 'checked';
    cb.addEventListener('change', () => {
      localStorage.setItem(key, cb.checked ? 'checked' : '');
      const complete = isComplete();
      if (complete && !wasComplete) showCartBoom();
      wasComplete = complete;
    });
  };

  const createCustomItem = (sectionName, item) => {
    const row = document.createElement('div');
    row.className = 'item custom-item';
    row.dataset.customId = item.id;

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = item.id;

    const label = document.createElement('label');
    label.htmlFor = item.id;
    label.textContent = item.text;

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove-item-btn';
    remove.setAttribute('aria-label', `Remove ${item.text}`);
    remove.textContent = 'x';
    remove.addEventListener('click', event => {
      event.stopPropagation();
      const addedItems = loadAddedItems();
      addedItems[sectionName] = (addedItems[sectionName] || []).filter(saved => saved.id !== item.id);
      saveAddedItems(addedItems);
      localStorage.removeItem(`this-week-${item.id}`);
      row.remove();
      wasComplete = isComplete();
    });

    row.append(checkbox, label, remove);
    registerCheckbox(checkbox);
    return row;
  };

  const hydrateAddedItems = () => {
    const addedItems = loadAddedItems();
    document.querySelectorAll('.section').forEach(section => {
      const header = section.querySelector('.section-header');
      const list = section.querySelector('.item-list');
      if (!header || !list) return;

      const sectionName = header.textContent.trim();
      const addButton = document.createElement('button');
      addButton.type = 'button';
      addButton.className = 'add-item-btn';
      addButton.setAttribute('aria-label', `Add item to ${sectionName}`);
      addButton.textContent = '+';
      addButton.addEventListener('click', () => {
        const text = window.prompt(`Add to ${sectionName}`);
        const cleanText = text?.trim();
        if (!cleanText) return;

        const added = loadAddedItems();
        const item = {
          id: `tw-custom-${slugify(sectionName)}-${Date.now()}`,
          text: cleanText
        };
        added[sectionName] = [...(added[sectionName] || []), item];
        saveAddedItems(added);
        list.appendChild(createCustomItem(sectionName, item));
        wasComplete = isComplete();
      });
      header.appendChild(addButton);

      (addedItems[sectionName] || []).forEach(item => {
        list.appendChild(createCustomItem(sectionName, item));
      });
    });
  };

  getCheckboxes().forEach(registerCheckbox);
  hydrateAddedItems();

  wasComplete = isComplete();
</script>
</body>
</html>
