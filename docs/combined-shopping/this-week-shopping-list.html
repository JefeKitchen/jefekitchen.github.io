<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - This Week</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
<style>
  .recipe-subhead {
    background: #141414;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.4px;
    padding: 8px 14px 6px;
    text-transform: uppercase;
  }
  .cart-boom {
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    position: fixed;
    z-index: 3000;
  }
  .boom-pop {
    animation: boom-pop 900ms ease-out forwards;
    filter: drop-shadow(0 0 14px rgba(184, 149, 58, .65));
    font-size: 42px;
    left: var(--x);
    opacity: 0;
    position: absolute;
    top: var(--y);
    transform: translate(-50%, -50%) scale(.4);
  }
  .boom-note {
    animation: boom-note 1800ms ease-out forwards;
    background: #171717;
    border: 1px solid #b8953a;
    border-radius: 8px;
    bottom: 22px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .42);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    left: 20px;
    padding: 14px 16px;
    position: fixed;
    right: 20px;
    text-align: center;
  }
  @keyframes boom-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(-14deg); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(8deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.7) rotate(18deg); }
  }
  @keyframes boom-note {
    0% { opacity: 0; transform: translateY(18px); }
    16%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(10px); }
  }
</style>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Carnitas Elote Bowls · Buffalo Chickpea Dip</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="recipe-subhead">Carnitas Elote Bowls</div>
    <div class="item"><input type="checkbox" id="tw19"><label for="tw19">Limes<span class="item-note">3-4, for rice, elote, finishing, and ranch water</span></label></div>
    <div class="item"><input type="checkbox" id="tw20"><label for="tw20">Cilantro<span class="item-note">1 bunch</span></label></div>
    <div class="item"><input type="checkbox" id="tw21"><label for="tw21">Green onions<span class="item-note">1 bunch</span></label></div>
    <div class="item"><input type="checkbox" id="tw22"><label for="tw22">Avocado<span class="item-note">1-2</span></label></div>
    <div class="item"><input type="checkbox" id="tw23"><label for="tw23">Shredded cabbage or slaw mix<span class="item-note">Small bag or half a small head</span></label></div>
    <div class="recipe-subhead">Buffalo Chickpea Dip</div>
    <div class="item"><input type="checkbox" id="tw33"><label for="tw33">Green onions<span class="item-note">For finishing the dip</span></label></div>
    <div class="item"><input type="checkbox" id="tw34"><label for="tw34">Lemon<span class="item-note">Optional finish if it needs brightness</span></label></div>
    <div class="item"><input type="checkbox" id="tw35"><label for="tw35">Celery sticks<span class="item-note">Optional, for scooping</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Dairy</div>
  <div class="item-list">
    <div class="recipe-subhead">Carnitas Elote Bowls</div>
    <div class="item"><input type="checkbox" id="tw24"><label for="tw24">Cotija<span class="item-note">About 1/2 cup crumbled</span></label></div>
    <div class="item"><input type="checkbox" id="tw25"><label for="tw25">Sour cream or crema<span class="item-note">About 1/4 cup</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Refrigerated</div>
  <div class="item-list">
    <div class="recipe-subhead">Buffalo Chickpea Dip</div>
    <div class="item"><input type="checkbox" id="tw36"><label for="tw36">Plain hummus<span class="item-note">About 1/2 cup</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="recipe-subhead">Carnitas Elote Bowls</div>
    <div class="item"><input type="checkbox" id="tw26"><label for="tw26">Rice<span class="item-note">1 cup dry white rice</span></label></div>
    <div class="item"><input type="checkbox" id="tw27"><label for="tw27">Corn<span class="item-note">2 cups frozen corn or 1 large can, drained</span></label></div>
    <div class="item"><input type="checkbox" id="tw28"><label for="tw28">Mayo<span class="item-note">About 2 tbsp</span></label></div>
    <div class="item"><input type="checkbox" id="tw29"><label for="tw29">Chili powder<span class="item-note">About 1/2 tsp</span></label></div>
    <div class="item"><input type="checkbox" id="tw30"><label for="tw30">Hot sauce<span class="item-note">For finishing</span></label></div>
    <div class="item"><input type="checkbox" id="tw31"><label for="tw31">Tortilla chips<span class="item-note">Optional crunch</span></label></div>
    <div class="item"><input type="checkbox" id="tw32"><label for="tw32">Tequila<span class="item-note">For ranch water</span></label></div>
    <div class="recipe-subhead">Buffalo Chickpea Dip</div>
    <div class="item"><input type="checkbox" id="tw37"><label for="tw37">Chickpeas<span class="item-note">1 can</span></label></div>
    <div class="item"><input type="checkbox" id="tw38"><label for="tw38">Buffalo-style hot sauce<span class="item-note">2 tbsp mild, 4 tbsp medium</span></label></div>
    <div class="item"><input type="checkbox" id="tw39"><label for="tw39">Fresh garlic<span class="item-note">1 small clove for the dip</span></label></div>
    <div class="item"><input type="checkbox" id="tw40"><label for="tw40">Smoked paprika</label></div>
    <div class="item"><input type="checkbox" id="tw41"><label for="tw41">Cayenne pepper<span class="item-note">Just for the medium batch</span></label></div>
    <div class="item"><input type="checkbox" id="tw42"><label for="tw42">Olive oil</label></div>
    <div class="item"><input type="checkbox" id="tw44"><label for="tw44">Kosher salt</label></div>
    <div class="item"><input type="checkbox" id="tw45"><label for="tw45">Garlic powder<span class="item-note">Optional for pita chips</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Snacks</div>
  <div class="item-list">
    <div class="recipe-subhead">Buffalo Chickpea Dip</div>
    <div class="item"><input type="checkbox" id="tw43"><label for="tw43">Pita, tortilla chips, or pita chips<span class="item-note">For scooping; pita can become DIY chips</span></label></div>
  </div>
</div>

<script>
  const checkboxes = Array.from(document.querySelectorAll('input[type="checkbox"]'));
  let wasComplete = false;

  const isComplete = () => checkboxes.length > 0 && checkboxes.every(cb => cb.checked);

  const showCartBoom = () => {
    document.querySelector('.cart-boom')?.remove();
    const boom = document.createElement('div');
    boom.className = 'cart-boom';
    [
      ['18%', '18%'],
      ['78%', '20%'],
      ['50%', '34%'],
      ['24%', '58%'],
      ['76%', '62%'],
      ['48%', '78%']
    ].forEach(([x, y], index) => {
      const pop = document.createElement('span');
      pop.className = 'boom-pop';
      pop.textContent = '💥';
      pop.style.setProperty('--x', x);
      pop.style.setProperty('--y', y);
      pop.style.animationDelay = `${index * 85}ms`;
      boom.appendChild(pop);
    });
    const note = document.createElement('div');
    note.className = 'boom-note';
    note.textContent = 'Groceries acquired.';
    boom.appendChild(note);
    document.body.appendChild(boom);
    window.setTimeout(() => boom.remove(), 2200);
  };

  checkboxes.forEach(cb => {
    const key = `this-week-${cb.id}`;
    cb.checked = localStorage.getItem(key) === 'checked';
    cb.addEventListener('change', () => {
      localStorage.setItem(key, cb.checked ? 'checked' : '');
      const complete = isComplete();
      if (complete && !wasComplete) showCartBoom();
      wasComplete = complete;
    });
  });

  wasComplete = isComplete();
</script>
</body>
</html>
