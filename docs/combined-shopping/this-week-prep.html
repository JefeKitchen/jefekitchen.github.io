<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Prep - This Week</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=17">
<link rel="stylesheet" href="../wide-layout.css?v=18">
<style>
  .meal-filter {
    border-top: 1px solid var(--border);
    margin: 0 0 16px !important;
    padding-top: 10px;
  }
  .meal-filter-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .meal-filter-btn {
    appearance: none; background: #181818; border: 1px solid var(--border); border-radius: 999px;
    color: var(--gold); cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    font-size: 12px; font-weight: 600; padding: 7px 10px; -webkit-tap-highlight-color: transparent;
  }
  .meal-filter-btn.is-off { color: var(--muted); opacity: .58; }
  .prep-board { gap: 30px; }
  .prep-meal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: grid;
    gap: 0;
    grid-column: 1 / -1;
    overflow: hidden;
    transition: opacity .16s ease;
  }
  .prep-meal + .prep-meal {
    margin-top: 2px;
  }
  .prep-meal.is-done { opacity: .62; }
  .prep-meal.is-done .prep-meal-board { display: none; }
  .prep-meal.is-done .prep-meal-head { border-bottom: 0; }
  .prep-meal.is-done .prep-meal-title { color: var(--muted) !important; text-decoration: line-through; }
  .prep-meal-head {
    background: var(--raised) !important;
    border: 0 !important;
    border-bottom: 1px solid var(--border) !important;
    cursor: pointer;
    display: block;
    padding: 13px 14px 12px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .prep-meal-title {
    background: transparent !important;
    border: 0 !important;
    color: var(--text) !important;
    font-family: 'Playfair Display', serif !important;
    font-size: clamp(26px, 3.2vw, 36px) !important;
    font-weight: 600 !important;
    letter-spacing: 0 !important;
    line-height: 1.08 !important;
    margin: 0 !important;
    padding: 0 !important;
    text-transform: none !important;
  }
  .prep-meal-meta {
    color: var(--gold);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .prep-meal-board {
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr;
    padding: 16px;
  }
  .prep-task {
    margin: 0 !important;
    position: relative;
  }
  @media (max-width: 719px) {
    body { max-width: 480px !important; margin: 0 auto !important; padding: 0 0 60px !important; }
    .back-bar { position: sticky !important; }
    .shell { margin: 0 !important; max-width: none !important; }
    .hero { margin: 18px 20px 14px !important; padding: 24px 20px 20px !important; }
    .hero-title { font-size: 36px !important; }
    .meal-filter { margin: 12px 20px 16px !important; }
    .prep-board { display: grid; margin: 0 20px 28px; }
    .prep-board { gap: 18px; }
    .prep-meal-head { padding: 12px 13px 11px; }
    .prep-meal-board { gap: 12px; padding: 12px; }
    .prep-meal-title { font-size: 28px !important; }
  }
  @media (min-width: 720px) {
    .prep-meal-board {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
</style>
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>
<main class="shell">
  <header class="hero">
    <div class="hero-title">Prep</div>
    <div class="hero-sub">This Week<br>Ahead of Time</div>
  </header>
  <div class="meal-filter" id="mealFilter"><div class="meal-filter-list" id="mealFilterList"></div></div>
  <div class="board prep-board" id="prepList"></div>
</main>

<script src="../recipe-catalog.js?v=4"></script>
<script src="../instruction-content.js?v=25"></script>
<script src="../recipe-serving-data.js?v=4"></script>
<script src="../quantity-scaler.js?v=4"></script>
<script src="../prep-catalog.js?v=5"></script>
<script src="../instruction-tools.js?v=1"></script>
<script type="module" src="../firebase-state.js?v=4"></script>
<script>
  const plannedRecipesKey = 'this-week-planned-recipes-v1';
  const shoppingRecipesKey = 'this-week-shopping-recipes-v1';
  const hiddenPrepMealsKey = 'this-week-hidden-prep-meals-v1';
  const prepDoneKey = 'this-week-prep-done-v1';
  const utilityIds = new Set(['this-week-prep']);
  const recipeCatalog = window.JEFES_KITCHEN_CATALOG?.recipes || {};
  const servingData = window.JEFES_KITCHEN_SERVINGS || window.JEFES_RECIPE_SERVINGS || {};
  const prepCatalog = window.JEFES_KITCHEN_PREP || {};
  const instructionContent = window.INSTRUCTION_CONTENT || {};
  const instructionTools = window.KitchenInstructionTools;
  let cloudPlans = null;
  let cloudStarted = false;
  let unwatchPlans = null;

  function readJson(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key) || '') ?? fallback; }
    catch { return fallback; }
  }
  function writeJson(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  }
  function normalizeEntries(entries) {
    if (!Array.isArray(entries)) return [];
    return entries.map(entry => {
      const id = entry.id || entry.recipeId;
      if (!id || utilityIds.has(id) || !recipeCatalog[id]) return null;
      return {
        id,
        recipeId: id,
        day: entry.day || '',
        date: entry.date || '',
        meal: entry.meal || 'dinner',
        servings: Number(entry.servings) || servingData[id]?.defaultServings || 3
      };
    }).filter(Boolean);
  }
  function localDateKey(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
  }
  function sortEntries(entries) {
    const today = new Date();
    const todayIndex = today.getDay();
    const dayOrder = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6 };
    return [...entries].sort((a, b) => {
      if (a.date && b.date && a.date !== b.date) return a.date.localeCompare(b.date);
      if (a.date && !b.date) return -1;
      if (!a.date && b.date) return 1;
      const aDay = a.day ? ((dayOrder[a.day] - todayIndex + 7) % 7) : 8;
      const bDay = b.day ? ((dayOrder[b.day] - todayIndex + 7) % 7) : 8;
      return aDay - bDay || (recipeCatalog[a.id]?.name || '').localeCompare(recipeCatalog[b.id]?.name || '');
    });
  }
  function isCurrentEntry(entry) { return !entry.date || entry.date >= localDateKey(); }
  function pruneExpiredEntries(entries) {
    const expired = entries.filter(entry => !isCurrentEntry(entry));
    if (!expired.length) return entries;

    const expiredIds = new Set(expired.map(entry => entry.id));
    const nextPlans = entries.filter(entry => !expiredIds.has(entry.id));
    const nextShopping = readJson(shoppingRecipesKey, []).filter(entry => !expiredIds.has(entry.id || entry.recipeId));
    cloudPlans = Array.isArray(cloudPlans) ? nextPlans : cloudPlans;
    writeJson(plannedRecipesKey, nextPlans);
    writeJson(shoppingRecipesKey, nextShopping);

    if (window.KitchenCloud?.isSignedIn?.()) {
      expiredIds.forEach(recipeId => {
        window.KitchenCloud.removePlan(recipeId).catch(error => {
          console.warn('Kitchen sync expired plan remove unavailable', error);
        });
        window.KitchenCloud.removeShoppingRecipe(recipeId).catch(error => {
          console.warn('Kitchen sync expired shopping remove unavailable', error);
        });
      });
    }
    return nextPlans;
  }
  function loadPlans() {
    const entries = Array.isArray(cloudPlans) ? cloudPlans : normalizeEntries(readJson(plannedRecipesKey, []));
    return sortEntries(pruneExpiredEntries(entries));
  }
  function loadSet(key) { return new Set(readJson(key, [])); }
  function saveSet(key, set) { writeJson(key, [...set]); }
  function entryMeta(entry) {
    return [entry.day, entry.servings ? entry.servings + ' servings' : ''].filter(Boolean).join(' · ');
  }
  function renderMealFilters(entries) {
    const wrap = document.getElementById('mealFilterList');
    const filter = document.getElementById('mealFilter');
    const hidden = loadSet(hiddenPrepMealsKey);
    wrap.innerHTML = '';
    filter.style.display = entries.length ? '' : 'none';
    entries.forEach(entry => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'meal-filter-btn' + (hidden.has(entry.id) ? ' is-off' : '');
      button.textContent = recipeCatalog[entry.id]?.name || entry.id;
      button.addEventListener('click', () => {
        const nextHidden = loadSet(hiddenPrepMealsKey);
        if (nextHidden.has(entry.id)) nextHidden.delete(entry.id);
        else nextHidden.add(entry.id);
        saveSet(hiddenPrepMealsKey, nextHidden);
        render();
      });
      wrap.appendChild(button);
    });
  }
  function recipeSections(entry) {
    const recipe = instructionContent[entry.id];
    if (!recipe || !instructionTools) return [];
    const defaults = servingData[entry.id] || {};
    return instructionTools.extractSections(recipe.body, {
      targetServings: entry.servings,
      baseServings: defaults.baseServings || defaults.defaultServings || 3,
      servingType: defaults.servingType || 'people'
    });
  }
  function findSection(sections, spec) {
    const wanted = String(spec.section || spec.title || '').toLowerCase();
    if (!wanted) return null;
    return sections.find(section => section.title.toLowerCase() === wanted) ||
      sections.find(section => section.key === wanted) ||
      sections.find(section => section.title.toLowerCase().includes(wanted));
  }
  function prepSectionFromSpec(sections, spec) {
    const section = findSection(sections, spec);
    if (!section) return null;
    if (isApplianceOnlySection(section)) return null;
    const next = { ...section };
    if (Array.isArray(spec.steps) && spec.steps.length) {
      next.steps = spec.steps
        .map(index => section.steps[index])
        .filter(Boolean);
      next.pills = instructionTools.pillsFromSteps(next.steps);
      next.full = next.steps.length >= 4 || section.full;
      next.split = next.steps.length >= 4 && section.split;
    }
    next.steps = adaptPrepAheadSteps(next.steps);
    next.pills = instructionTools.pillsFromSteps(next.steps).length ? instructionTools.pillsFromSteps(next.steps) : next.pills;
    return next;
  }
  function isApplianceOnlySection(section) {
    const title = String(section.title || '').toLowerCase();
    const label = String(section.label || '').toLowerCase();
    const setupOnly = /\b(set up|setup|preheat|heat up|warm up|stage)\b/.test(title + ' ' + label);
    const appliance = /\b(oven|breville|toaster|press|grill|wok|skillet|sheet pan|pan|casserole|rack)\b/.test(title + ' ' + label);
    return setupOnly && appliance;
  }
  function stepText(step) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = step;
    return wrapper.textContent.trim();
  }
  function adaptPrepAheadSteps(steps) {
    const next = [];
    steps.forEach(step => {
      const text = stepText(step);
      const lower = text.toLowerCase();
      if (/\b(serve immediately|serve with|build plates|build the bowls|plate it up|finish and serve)\b/.test(lower)) return;
      if (/\b(keep covered off heat|hold just fine|keep it next to the stove|keep near the stove|set aside|let it sit while|hang out while|until serving|until the .* ready|right before serving)\b/.test(lower)) {
        if (!next.some(existing => /refrigerate/i.test(stepText(existing)))) {
          const cooked = /\b(rice|noodles?|cook|warm|heat|hot)\b/.test(lower);
          next.push(cooked
            ? '<span>Let cool, then refrigerate until cook time.</span>'
            : '<span>Refrigerate until cook time.</span>');
        }
        return;
      }
      next.push(step);
    });
    return next;
  }
  function renderTask(section) {
    return instructionTools.renderSectionCard(section, { className: 'prep-task' });
  }
  function balancePrepGrid(sections) {
    const next = sections.map(section => ({ ...section }));
    let trailingHalfWidth = 0;
    for (let index = next.length - 1; index >= 0; index -= 1) {
      if (next[index].full) break;
      trailingHalfWidth += 1;
    }
    if (trailingHalfWidth % 2 === 1 && next.length) {
      next[next.length - 1].full = true;
    }
    return next;
  }
  function render() {
    const entries = sortEntries(loadPlans());
    const hidden = loadSet(hiddenPrepMealsKey);
    const done = loadSet(prepDoneKey);
    const list = document.getElementById('prepList');
    const prepReady = entries.filter(entry => Array.isArray(prepCatalog[entry.id]) && prepCatalog[entry.id].length);
    renderMealFilters(prepReady);
    const visible = prepReady.filter(entry => !hidden.has(entry.id));
    list.innerHTML = visible.map(entry => {
      const recipe = recipeCatalog[entry.id];
      const sections = recipeSections(entry);
      const prepSections = prepCatalog[entry.id]
        .map(spec => prepSectionFromSpec(sections, spec))
        .filter(Boolean);
      if (!prepSections.length) return '';
      const balancedSections = balancePrepGrid(prepSections);
      const doneId = 'meal:' + entry.id;
      const checked = done.has(doneId);
      const meta = entryMeta(entry);
      return '<section class="prep-meal' + (checked ? ' is-done' : '') + '" data-done-id="' + escapeHtml(doneId) + '">' +
        '<header class="prep-meal-head" role="button" tabindex="0" aria-pressed="' + (checked ? 'true' : 'false') + '" aria-label="Toggle prep for ' + escapeHtml(recipe?.name || entry.id) + '">' +
        (meta ? '<div class="prep-meal-meta">' + escapeHtml(meta) + '</div>' : '') +
        '<h2 class="prep-meal-title">' + escapeHtml(recipe?.name || entry.id) + '</h2></header>' +
        '<div class="prep-meal-board">' + balancedSections.map(section => renderTask(section)).join('') + '</div>' +
      '</section>';
    }).join('');
    list.querySelectorAll('.prep-meal-head').forEach(header => {
      const toggleMeal = () => {
        const meal = header.closest('.prep-meal');
        const nextDone = loadSet(prepDoneKey);
        const nextChecked = !meal.classList.contains('is-done');
        if (nextChecked) nextDone.add(meal.dataset.doneId);
        else nextDone.delete(meal.dataset.doneId);
        saveSet(prepDoneKey, nextDone);
        meal.classList.toggle('is-done', nextChecked);
        header.setAttribute('aria-pressed', nextChecked ? 'true' : 'false');
      };
      header.addEventListener('click', toggleMeal);
      header.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        toggleMeal();
      });
    });
  }
  function startCloudSync() {
    if (cloudStarted || !window.KitchenCloud) return;
    cloudStarted = true;
    window.KitchenCloud.watchAuth(user => {
      if (unwatchPlans) unwatchPlans();
      if (!user) { cloudPlans = null; render(); return; }
      unwatchPlans = window.KitchenCloud.watchPlans(entries => {
        cloudPlans = sortEntries(pruneExpiredEntries(normalizeEntries(entries)));
        writeJson(plannedRecipesKey, cloudPlans);
        render();
      }, () => { cloudPlans = null; render(); });
    });
  }
  render();
  window.addEventListener('kitchen-cloud-ready', startCloudSync);
  startCloudSync();
</script>
</body>
</html>
