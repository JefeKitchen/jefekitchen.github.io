<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f2f2f0;
    color: #111;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    margin: 0 auto;
    max-width: 480px;
    padding: 32px 20px 60px;
  }

  .page-title {
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .page-sub {
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .section {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .section-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    padding: 9px 16px;
  }

  .section-header.need {
    background: #111;
    color: #fff;
  }

  .item-list { padding: 6px 0; }

  .item {
    align-items: flex-start;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    display: flex;
    gap: 14px;
    padding: 10px 16px;
  }

  .item:last-child { border-bottom: 0; }

  .item input[type="checkbox"] {
    accent-color: #111;
    cursor: pointer;
    flex-shrink: 0;
    height: 16px;
    margin-top: 2px;
    width: 16px;
  }

  .item label {
    color: #111;
    cursor: pointer;
    flex: 1;
    font-size: 14.5px;
    line-height: 1.4;
    pointer-events: none;
  }

  .item input[type="checkbox"]:checked ~ label {
    color: #aaa;
    text-decoration: line-through;
  }

  .item-note {
    color: #999;
    display: block;
    font-size: 11.5px;
    margin-top: 1px;
  }
</style>
<link rel="stylesheet" href="../theme.css?v=4">

<script src="../grocery-boom.js?v=1"></script>
<script>
const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
const key = 'mojo-pork-bowls-grocery-v1';
const saved = JSON.parse(localStorage.getItem(key) || '{}');
boxes.forEach((box) => {
  box.checked = !!saved[box.id];
  box.addEventListener('change', () => {
    saved[box.id] = box.checked;
    localStorage.setItem(key, JSON.stringify(saved));
    window.GroceryBoom && window.GroceryBoom.check(boxes);
  });
});
</script>
