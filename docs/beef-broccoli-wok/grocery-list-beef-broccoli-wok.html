<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List — Beef & Broccoli Wok</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f2f2f0;
    color: #111;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    margin: 0 auto;
    max-width: 480px;
    padding: 32px 20px 60px;
  }

  .page-title {
    color: #111;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .page-sub {
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .section {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .section-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    padding: 9px 16px;
  }

  .section-header.need {
    background: #111;
    color: #fff;
  }

  .item-list { padding: 6px 0; }

  .item {
    align-items: flex-start;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    display: flex;
    gap: 14px;
    padding: 10px 16px;
  }

  .item:last-child { border-bottom: 0; }

  .item input[type="checkbox"] {
    accent-color: #111;
    cursor: pointer;
    flex-shrink: 0;
    height: 16px;
    margin-top: 2px;
    width: 16px;
  }

  .item label {
    color: #111;
    cursor: pointer;
    flex: 1;
    font-size: 14.5px;
    line-height: 1.4;
    pointer-events: none;
  }

  .item input[type="checkbox"]:checked ~ label {
    color: #aaa;
    text-decoration: line-through;
  }

  .item-note {
    color: #999;
    display: block;
    font-size: 11.5px;
    margin-top: 1px;
  }
</style>
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<style>.back-bar{position:sticky;top:0;z-index:1000;background:#171717;border-bottom:1px solid #2c2c2c;padding:4px 10px;margin:-32px -20px 28px;}.back-bar a{color:#b8953a;text-decoration:none;font-family:-apple-system,sans-serif;font-size:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;}</style>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Beef & Broccoli Wok</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="bb-0">
      <label for="bb-0">Broccoli<span class="item-note">1 large head or about 12 oz florets</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-1">
      <label for="bb-1">Garlic<span class="item-note">1 head</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-2">
      <label for="bb-2">Fresh ginger<span class="item-note">Small piece</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-3">
      <label for="bb-3">Green onions<span class="item-note">1 bunch</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-4">
      <label for="bb-4">English cucumber<span class="item-note">1, for side</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Meat/Seafood</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="bb-5">
      <label for="bb-5">Flank, skirt, or sirloin steak<span class="item-note">1 lb</span></label>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="item">
      <input type="checkbox" id="bb-6">
      <label for="bb-6">Jasmine rice<span class="item-note">1 1/2 cups dry</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-7">
      <label for="bb-7">Soy sauce<span class="item-note">About 1/3 cup total</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-8">
      <label for="bb-8">Oyster sauce<span class="item-note">About 2 tbsp</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-9">
      <label for="bb-9">Rice vinegar<span class="item-note">For sauce and cucumber side</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-10">
      <label for="bb-10">Sesame oil<span class="item-note">Small bottle</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-11">
      <label for="bb-11">Cornstarch<span class="item-note">For beef and sauce</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-12">
      <label for="bb-12">Brown sugar or honey<span class="item-note">About 1 tbsp</span></label>
    </div>
    <div class="item">
      <input type="checkbox" id="bb-13">
      <label for="bb-13">Neutral high-heat oil<span class="item-note">Canola, vegetable, avocado, or peanut</span></label>
    </div>
  </div>
</div>

<script src="../grocery-boom.js?v=1"></script>
<script>
const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
const key = 'beef-broccoli-wok-grocery-v1';
const saved = JSON.parse(localStorage.getItem(key) || '{}');
boxes.forEach((box) => {
  box.checked = !!saved[box.id];
  box.addEventListener('change', () => {
    saved[box.id] = box.checked;
    localStorage.setItem(key, JSON.stringify(saved));
    window.GroceryBoom && window.GroceryBoom.check(boxes);
  });
});
</script>
</body>
</html>
