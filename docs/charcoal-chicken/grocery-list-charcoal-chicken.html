<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - Charcoal Chicken</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=3">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>

<div class="page-title">Grocery List</div>
<div class="page-sub">Charcoal Chicken</div>

<div class="section">
  <div class="section-header need">Meat</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="cc1"><label for="cc1">2 lb boneless skinless chicken thighs</label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Produce</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="cc2"><label for="cc2">1 lemon</label></div>
    <div class="item"><input type="checkbox" id="cc3"><label for="cc3">Fresh parsley</label></div>
    <div class="item"><input type="checkbox" id="cc4"><label for="cc4">2 cloves garlic</label></div>
    <div class="item"><input type="checkbox" id="cc13"><label for="cc13">4 ears corn<span class="item-note">For grilled corn salad</span></label></div>
    <div class="item"><input type="checkbox" id="cc14"><label for="cc14">1 cucumber or salad greens<span class="item-note">Cold side</span></label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Sauce</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="cc5"><label for="cc5">Chicken broth<span class="item-note">About 1 cup</span></label></div>
    <div class="item"><input type="checkbox" id="cc6"><label for="cc6">Prepared horseradish</label></div>
    <div class="item"><input type="checkbox" id="cc7"><label for="cc7">Dijon mustard</label></div>
    <div class="item"><input type="checkbox" id="cc8"><label for="cc8">Sour cream or Greek yogurt</label></div>
  </div>
</div>

<div class="section">
  <div class="section-header need">Pantry</div>
  <div class="item-list">
    <div class="item"><input type="checkbox" id="cc9"><label for="cc9">Olive oil</label></div>
    <div class="item"><input type="checkbox" id="cc10"><label for="cc10">Honey</label></div>
    <div class="item"><input type="checkbox" id="cc11"><label for="cc11">Smoked paprika</label></div>
    <div class="item"><input type="checkbox" id="cc12"><label for="cc12">Kosher salt and black pepper</label></div>
    <div class="item"><input type="checkbox" id="cc15"><label for="cc15">Butter<span class="item-note">For corn, optional</span></label></div>
  </div>
</div>

<script>
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    const key = `charcoal-chicken-${cb.id}`;
    cb.checked = localStorage.getItem(key) === 'checked';
    cb.addEventListener('change', () => localStorage.setItem(key, cb.checked ? 'checked' : ''));
  });
</script>
</body>
</html>
