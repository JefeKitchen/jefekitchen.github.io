<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Grocery List - Beef Stroganoff Skillet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css?v=4">
</head>
<body>
<div class="back-bar"><a href="../../index.html" aria-label="Back to kitchen">&#8249;</a></div>
<div class="page-title">Grocery List</div><div class="page-sub">Beef Stroganoff Skillet</div>
<div class="section"><div class="section-header need">Produce</div><div class="item-list">
  <div class="item"><input type="checkbox" id="bs1"><label for="bs1">Yellow onion<span class="item-note">1 medium</span></label></div>
  <div class="item"><input type="checkbox" id="bs2"><label for="bs2">Cremini or white mushrooms<span class="item-note">8 oz</span></label></div>
  <div class="item"><input type="checkbox" id="bs3"><label for="bs3">Garlic<span class="item-note">3 cloves</span></label></div>
  <div class="item"><input type="checkbox" id="bs4"><label for="bs4">Green beans<span class="item-note">8 oz</span></label></div>
  <div class="item"><input type="checkbox" id="bs5"><label for="bs5">Parsley<span class="item-note">Small bunch, optional</span></label></div>
</div></div>
<div class="section"><div class="section-header need">Meat/Seafood</div><div class="item-list"><div class="item"><input type="checkbox" id="bs6"><label for="bs6">Sirloin steak<span class="item-note">1 lb</span></label></div></div></div>
<div class="section"><div class="section-header need">Dairy</div><div class="item-list"><div class="item"><input type="checkbox" id="bs7"><label for="bs7">Sour cream<span class="item-note">1/2 cup, or split with Greek yogurt</span></label></div><div class="item"><input type="checkbox" id="bs8"><label for="bs8">Butter<span class="item-note">2 tbsp</span></label></div></div></div>
<div class="section"><div class="section-header need">Pantry</div><div class="item-list"><div class="item"><input type="checkbox" id="bs9"><label for="bs9">Beef broth<span class="item-note">1 cup</span></label></div><div class="item"><input type="checkbox" id="bs10"><label for="bs10">Dijon mustard<span class="item-note">1 tbsp</span></label></div><div class="item"><input type="checkbox" id="bs11"><label for="bs11">Worcestershire sauce<span class="item-note">2 tsp</span></label></div><div class="item"><input type="checkbox" id="bs12"><label for="bs12">Flour<span class="item-note">1 tbsp</span></label></div></div></div>
<div class="section"><div class="section-header need">Alcohol/Drinks</div><div class="item-list"><div class="item"><input type="checkbox" id="bs13"><label for="bs13">Dry red wine<span class="item-note">Optional pairing</span></label></div></div></div>
<script>document.querySelectorAll('input[type="checkbox"]').forEach(cb=>{const key=`beef-stroganoff-skillet-${cb.id}`;cb.checked=localStorage.getItem(key)==='checked';cb.addEventListener('change',()=>localStorage.setItem(key,cb.checked?'checked':''));});</script><script src="../grocery-boom.js?v=1"></script>
</body>
</html>
