<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<title>Jefe's Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --raised: #202020;
    --border: #2c2c2c;
    --gold: #b8953a;
    --text: #ddd8cf;
    --muted: #5e5a55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* HEADER */
  .app-header {
    background: var(--surface);
    padding: 48px 20px 22px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .app-title {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .app-title span { color: var(--gold); }
  /* SECTIONS */
  .group-label {
    margin: 24px 20px 8px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .group-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section {
    margin: 0 20px 8px;
  }
  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .card-header {
    padding: 11px 14px;
    background: var(--raised);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    list-style: none;
    -webkit-tap-highlight-color: transparent;
  }
  .direct-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px;
    background: var(--gold);
    border: 1px solid #d0b35f;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
    -webkit-tap-highlight-color: transparent;
  }
  .direct-card:active { filter: brightness(1.08); }
  .poll-section {
    margin-top: 18px;
  }
  .direct-card .card-title {
    color: #111010;
    font-size: 22px;
  }
  .direct-card .card-subtitle {
    color: rgba(17, 16, 16, 0.76);
    font-size: 12px;
    font-weight: 600;
  }
  .direct-card .link-arrow {
    color: #111010;
    font-size: 18px;
  }
  .card-header::-webkit-details-marker { display: none; }
  .card[open] .card-header { border-bottom: 1px solid var(--border); }
  .recipe-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px 11px 14px;
  }
  .card-copy {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }
  .card-subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    display: block;
    margin-top: 2px;
  }
  .dropdown-icon {
    color: var(--gold);
    font-size: 16px;
    line-height: 1;
    transform: rotate(0deg);
    transition: transform 150ms ease;
  }
  .card[open] .dropdown-icon { transform: rotate(90deg); }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-link {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--raised);
    color: var(--gold);
    font-size: 16px;
    line-height: 1;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-link:active {
    filter: brightness(1.15);
  }
  .misc {
    margin: 28px 20px 0;
  }
  .misc summary {
    list-style: none;
    height: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .misc summary::-webkit-details-marker { display: none; }
  .misc summary::before {
    content: '';
    width: 28px;
    height: 1px;
    background: var(--border);
    opacity: 0.7;
  }
  .misc[open] summary::before {
    background: var(--gold);
  }
  .misc-link {
    color: var(--muted);
    display: block;
    font-size: 13px;
    margin-top: 4px;
    padding: 4px 0;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .misc-link + .misc-link {
    margin-top: 0;
  }
  .misc-link:active {
    color: var(--gold);
  }

  /* LINKS */
  .link-list { padding: 2px 0; }
  .link-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .link-item:last-child { border-bottom: none; }
  .link-item:active { background: var(--raised); }
  .link-text {
    font-size: 14px;
    color: var(--text);
    flex: 1;
    line-height: 1.3;
  }
  .link-arrow {
    font-size: 13px;
    color: var(--gold);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div class="app-title">JEFE'S<br><span>KITCHEN</span></div>
</div>

<div class="section poll-section">
  <a class="direct-card" href="./docs/poll/dinner-poll.html">
    <div class="card-copy">
      <div class="card-title">Pick Din</div>
    </div>
  </a>
</div>

<div class="group-label">Beef</div>

<!-- SLIDER NIGHT -->
<div class="section">
  <div class="card recipe-card">
    <div class="card-copy">
      <div class="card-title">Smash Sliders</div>
    </div>
    <div class="card-actions" aria-label="Smash Sliders links">
      <a class="icon-link" href="./docs/smash-sliders/slider-menu.html" aria-label="Smash Sliders menu" title="Menu">🧾</a>
      <a class="icon-link" href="./docs/smash-sliders/grocery-list.html" aria-label="Smash Sliders grocery list" title="Grocery List">🛒</a>
      <a class="icon-link" href="./docs/smash-sliders/slider-prep-order.html" aria-label="Smash Sliders cooking instructions" title="Cooking Instructions">🥘</a>
    </div>
  </div>
</div>

<!-- MEATLOAF -->
<div class="section">
  <div class="card recipe-card">
    <div class="card-copy">
      <div class="card-title">Meatloaf</div>
      <span class="card-subtitle">Horseradish · Potatoes</span>
    </div>
    <div class="card-actions" aria-label="Meatloaf links">
      <a class="icon-link" href="./docs/meatloaf/grocery-list-meatloaf.html" aria-label="Meatloaf grocery list" title="Grocery List">🛒</a>
      <a class="icon-link" href="./docs/meatloaf/meatloaf-instructions.html" aria-label="Meatloaf cooking instructions" title="Cooking Instructions">🥘</a>
    </div>
  </div>
</div>

<div class="group-label">Chicken</div>

<!-- HONEY MUSTARD CHICKEN -->
<div class="section">
  <div class="card recipe-card">
    <div class="card-copy">
      <div class="card-title">Honey Mustard Chicken</div>
      <span class="card-subtitle">Potatoes</span>
    </div>
    <div class="card-actions" aria-label="Honey Mustard Chicken links">
      <a class="icon-link" href="./docs/honey-mustard/grocery-list-honey-mustard.html" aria-label="Honey Mustard Chicken grocery list" title="Grocery List">🛒</a>
      <a class="icon-link" href="./docs/honey-mustard/honey-mustard-instructions.html" aria-label="Honey Mustard Chicken cooking instructions" title="Cooking Instructions">🥘</a>
    </div>
  </div>
</div>

<!-- HONEY GARLIC CHICKEN -->
<div class="section">
  <div class="card recipe-card">
    <div class="card-copy">
      <div class="card-title">Honey Garlic Chicken</div>
      <span class="card-subtitle">Green Beans · Rice · Cucumber</span>
    </div>
    <div class="card-actions" aria-label="Honey Garlic Chicken links">
      <a class="icon-link" href="./docs/honey-garlic/grocery-list-honey-garlic.html" aria-label="Honey Garlic Chicken grocery list" title="Grocery List">🛒</a>
      <a class="icon-link" href="./docs/honey-garlic/honey-garlic-chicken-instructions.html" aria-label="Honey Garlic Chicken cooking instructions" title="Cooking Instructions">🥘</a>
    </div>
  </div>
</div>

<!-- TERIYAKI SPREAD -->
<div class="section">
  <div class="card recipe-card">
    <div class="card-copy">
      <div class="card-title">Pineapple Orange Teriyaki</div>
      <span class="card-subtitle">Cucumber · Coconut · Rice</span>
    </div>
    <div class="card-actions" aria-label="Pineapple Orange Teriyaki links">
      <a class="icon-link" href="./docs/teriyaki/teriyaki-menu.html" aria-label="Pineapple Orange Teriyaki dinner menu" title="Dinner Menu">🧾</a>
      <a class="icon-link" href="./docs/teriyaki/grocery-list-combined-2.html" aria-label="Pineapple Orange Teriyaki grocery list" title="Grocery List">🛒</a>
      <a class="icon-link" href="./docs/teriyaki/teriyaki-spread-instructions.html" aria-label="Pineapple Orange Teriyaki cooking instructions" title="Cooking Instructions">🥘</a>
    </div>
  </div>
</div>

<!-- CHICKEN SKEWERS -->
<div class="section">
  <div class="card recipe-card">
    <div class="card-copy">
      <div class="card-title">Chicken Skewers</div>
      <span class="card-subtitle">Pita · Cucumber · Tomato</span>
    </div>
    <div class="card-actions" aria-label="Chicken Skewers links">
      <a class="icon-link" href="./docs/chicken-skewers/grocery-list-chicken-skewers.html" aria-label="Chicken Skewers grocery list" title="Grocery List">🛒</a>
      <a class="icon-link" href="./docs/chicken-skewers/chicken-skewers-instructions.html" aria-label="Chicken Skewers cooking instructions" title="Cooking Instructions">🥘</a>
    </div>
  </div>
</div>

<details class="misc" data-section="misc">
  <summary aria-label="Open miscellaneous"></summary>
  <a class="misc-link" href="./docs/seasoning/griddle-initial-seasoning.html">Seasoning</a>
</details>


<script>
  const sectionStateKey = 'jefes-kitchen-open-sections';
  let savedSections = {};

  try {
    savedSections = JSON.parse(localStorage.getItem(sectionStateKey) || '{}');
  } catch {
    savedSections = {};
  }

  document.querySelectorAll('details[data-section]').forEach(section => {
    const sectionName = section.dataset.section;
    if (savedSections[sectionName]) section.open = true;

    section.addEventListener('toggle', () => {
      savedSections[sectionName] = section.open;
      localStorage.setItem(sectionStateKey, JSON.stringify(savedSections));
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>

</body>
</html>
