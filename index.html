<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./assets/icons/favicon.png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<title>Jefe's Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #171717;
    --raised: #202020;
    --border: #2c2c2c;
    --gold: #b8953a;
    --text: #ddd8cf;
    --muted: #5e5a55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* HEADER */
  .app-header {
    background: var(--surface);
    padding: 48px 20px 22px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .app-title {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .app-title span { color: var(--gold); }
  /* SECTIONS */
  .zone-label {
    margin: 28px 20px 10px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
  }
  .group-label {
    margin: 18px 20px 8px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .group-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
    order: 2;
  }
  .group-label-text {
    flex-shrink: 0;
    order: 1;
  }
  .group-add-btn {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 16px;
    line-height: 1;
    margin-left: -4px;
    order: 3;
    padding: 4px 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .group-add-btn:active {
    color: var(--gold);
  }
  .recipe-group {
    margin: 0;
  }
  .recipe-group > summary {
    list-style: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .recipe-group > summary::-webkit-details-marker { display: none; }
  .recipe-group > summary::before {
    content: '›';
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    transform: translateY(-1px) rotate(0deg);
    transition: transform 150ms ease;
  }
  .recipe-group[open] > summary::before {
    transform: translateY(-1px) rotate(90deg);
  }
  .recipe-group.featured {
    margin: 22px 20px 4px;
    padding: 8px 0 2px;
  }
  .recipe-group.featured > summary {
    margin: 0;
    color: var(--gold);
  }
  .recipe-group.featured[open] > summary {
    margin-bottom: 10px;
  }
  .recipe-group.featured .section {
    margin-left: 0;
    margin-right: 0;
  }
  .recipe-group.featured .recipe-card {
    background: #1d1a13;
    border-color: rgba(184, 149, 58, 0.34);
  }
  .week-plan-hidden {
    display: none !important;
  }
  .dot-divider {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 6px;
    line-height: 1;
    margin: 8px 20px 8px;
    opacity: 0.82;
    text-align: center;
  }
  .dot-divider + .recipe-group > summary {
    margin-top: 6px;
  }
  .section {
    margin: 0 20px 8px;
  }
  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .card-header {
    padding: 11px 14px;
    background: var(--raised);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    list-style: none;
    -webkit-tap-highlight-color: transparent;
  }
  .direct-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px;
    background: var(--gold);
    border: 1px solid #d0b35f;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
    -webkit-tap-highlight-color: transparent;
  }
  .direct-card:active { filter: brightness(1.08); }
  .poll-section {
    margin-top: 18px;
  }
  .direct-card .card-title {
    color: #111010;
    font-size: 22px;
  }
  .direct-card .card-subtitle {
    color: rgba(17, 16, 16, 0.76);
    font-size: 12px;
    font-weight: 600;
  }
  .direct-card .link-arrow {
    color: #111010;
    font-size: 18px;
  }
  .card-header::-webkit-details-marker { display: none; }
  .card[open] .card-header { border-bottom: 1px solid var(--border); }
  .recipe-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px 11px 14px;
    -webkit-user-select: none;
    user-select: none;
  }
  .recipe-card[data-card-href],
  .recipe-card[data-default-instructions] {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .recipe-card[data-card-href]:active,
  .recipe-card[data-default-instructions]:active {
    filter: brightness(1.06);
  }
  .card-copy {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }
  .title-line {
    align-items: flex-start;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .title-line .card-title {
    flex: 0 1 auto;
  }
  .plan-day {
    color: var(--gold);
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.8px;
    line-height: 1.1;
    order: -1;
    text-transform: uppercase;
  }
  .plan-meta {
    color: var(--gold);
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.8px;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .card-subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    display: block;
    margin-top: 2px;
  }
  .dropdown-icon {
    color: var(--gold);
    font-size: 16px;
    line-height: 1;
    transform: rotate(0deg);
    transition: transform 150ms ease;
  }
  .card[open] .dropdown-icon { transform: rotate(90deg); }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .icon-link {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--raised);
    color: var(--gold);
    font-size: 16px;
    line-height: 1;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-link:active {
    filter: brightness(1.15);
  }
  .week-remove-btn {
    align-items: center;
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 18px;
    height: 34px;
    justify-content: center;
    line-height: 1;
    margin-left: 1px;
    padding: 0;
    width: 22px;
    -webkit-tap-highlight-color: transparent;
  }
  .week-remove-btn:active {
    color: var(--gold);
  }
  .choice-sheet {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 18px;
    background: rgba(0, 0, 0, 0.56);
  }
  .choice-sheet.is-open {
    display: flex;
  }
  .choice-panel {
    width: min(100%, 360px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.44);
  }
  .choice-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.15;
    margin-bottom: 4px;
  }
  .choice-subtitle {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .choice-actions {
    display: grid;
    gap: 8px;
  }
  .choice-button {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--raised);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 12px 14px;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .choice-button:active {
    filter: brightness(1.12);
  }
  .choice-cancel {
    color: var(--muted);
    text-align: center;
  }
  .choice-button.choice-primary {
    background: var(--gold);
    border-color: #d0b35f;
    color: #111010;
    font-weight: 600;
    text-align: center;
  }
  .week-form {
    display: grid;
    gap: 8px;
  }
  .week-form select {
    appearance: none;
    background: #101010;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-sizing: border-box;
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 16px;
    padding: 11px 12px;
    width: 100%;
  }
  .week-check {
    align-items: center;
    color: var(--muted);
    display: inline-flex;
    font-size: 13px;
    gap: 8px;
    justify-self: start;
    padding: 2px 0 3px;
    -webkit-tap-highlight-color: transparent;
  }
  .week-check input {
    accent-color: var(--gold);
    height: 15px;
    width: 15px;
  }
  .week-check-row {
    display: flex;
    gap: 14px;
  }
  .misc {
    margin: 16px 20px 0;
  }
  .misc summary {
    list-style: none;
    height: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .misc summary::-webkit-details-marker { display: none; }
  .misc summary::before {
    content: '';
    width: 28px;
    height: 1px;
    background: var(--border);
    opacity: 0.7;
  }
  .misc[open] summary::before {
    background: var(--gold);
  }
  .misc-link,
  .misc-button {
    background: none;
    border: 0;
    color: var(--muted);
    display: block;
    font-size: 13px;
    font-family: inherit;
    margin-top: 4px;
    padding: 4px 0;
    text-decoration: none;
    text-align: left;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .misc-button {
    cursor: pointer;
  }
  .misc-link + .misc-link {
    margin-top: 0;
  }
  .misc-link:active,
  .misc-button:active {
    color: var(--gold);
  }

  /* LINKS */
  .link-list { padding: 2px 0; }
  .link-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .link-item:last-child { border-bottom: none; }
  .link-item:active { background: var(--raised); }
  .link-text {
    font-size: 14px;
    color: var(--text);
    flex: 1;
    line-height: 1.3;
  }
  .link-arrow {
    font-size: 13px;
    color: var(--gold);
    flex-shrink: 0;
  }

  @media (min-width: 640px) {
    body {
      max-width: 1120px;
      padding: 24px 28px 72px;
    }

    .app-header {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 0 0 22px;
      padding: 22px 26px;
      position: static;
    }

    .app-title {
      font-size: 48px;
      line-height: 1;
    }

    .app-title br {
      display: none;
    }

    .poll-section {
      margin: 0 0 24px;
    }

    .direct-card {
      min-height: 94px;
      padding: 22px 26px;
    }

    .direct-card .card-title {
      font-size: 34px;
    }

    .recipe-group {
      margin: 0 0 12px;
    }

    .recipe-group.featured {
      margin: 0 0 14px;
      padding: 0;
    }

    .recipe-group > summary,
    .recipe-group.featured > summary {
      margin: 12px 0 4px;
    }

    .recipe-group[open] > summary,
    .recipe-group.featured[open] > summary {
      margin-bottom: 0;
    }

    .recipe-group .group-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      width: 100%;
    }

    .recipe-group .section,
    .recipe-group.featured .section {
      margin: 0;
      min-width: 0;
    }

    .recipe-card {
      min-height: 66px;
      padding: 13px 14px 13px 16px;
    }

    .card {
      height: 100%;
      margin-bottom: 0;
    }

    .card-title {
      font-size: 19px;
    }

    .card-subtitle {
      font-size: 12px;
    }

    .dot-divider {
      margin: 6px 0 10px;
    }

    .misc {
      margin: 18px 0 0;
      max-width: 360px;
    }

    .choice-sheet {
      align-items: center;
    }
  }
</style>
<script src="./docs/recipe-catalog.js?v=3"></script>
<script src="./docs/recipe-serving-data.js?v=3"></script>
<script type="module" src="./docs/firebase-state.js?v=4"></script>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div class="app-title">JEFE'S<br><span>KITCHEN</span></div>
</div>


<details class="recipe-group featured" data-section="this-week">
<summary class="group-label"><span class="group-label-text">This Week</span><button class="group-add-btn" type="button" id="addThisWeekRecipe" aria-label="Add recipe to This Week">+</button></summary>
<div class="group-grid" id="thisWeekGrid">

<!-- THIS WEEK: GROCERY LIST -->
<div class="section">
  <div class="card recipe-card" data-card-href="./docs/combined-shopping/this-week-shopping-list.html" role="link" tabindex="0">
    <div class="card-copy">
      <div class="card-title">Grocery List</div>
      <span class="card-subtitle">Add items as needed</span>
    </div>
    <div class="card-actions" aria-label="This Week grocery list link">

</div>

</div>
</details>

<div class="dot-divider" aria-hidden="true">...</div>

<div id="recipeGroups"></div>

<details class="misc" data-section="misc">
  <summary aria-label="Open miscellaneous"></summary>
  <a class="misc-link" href="./docs/seasoning/griddle-initial-seasoning.html">Seasoning</a>
  <button class="misc-button" type="button" id="resetInstructionChoice">Reset instruction layout</button>
</details>

<div class="choice-sheet" id="instructionChoice" aria-hidden="true">
  <div class="choice-panel" role="dialog" aria-modal="true" aria-labelledby="instructionChoiceTitle">
    <div class="choice-title" id="instructionChoiceTitle">Cooking Instructions</div>
    <div class="choice-subtitle">Choose the layout you want.</div>
    <div class="choice-actions">
      <button class="choice-button" type="button" data-choice="phone">Phone layout</button>
      <button class="choice-button" type="button" data-choice="wide">Wide layout</button>

<div class="choice-sheet" id="weekChoice" aria-hidden="true">

      <select id="weekRecipeSection" aria-label="Recipe section"></select>
      <select id="weekRecipeChoice" aria-label="Recipe"></select>
      <select id="weekRecipeDay" aria-label="Day"></select>

        <button class="choice-button choice-primary" type="submit" id="weekRecipeSubmit">Add</button>
        <button class="choice-button choice-cancel" type="button" id="cancelWeekRecipe">Cancel</button>
      </div>

</div>


<script>
  const sectionStateKey = 'jefes-kitchen-open-sections';
  const instructionPreferenceKey = 'jefes-kitchen-instruction-layout';
  const thisWeekRecipesKey = 'this-week-planned-recipes-v1';
  const thisWeekShoppingRecipesKey = 'this-week-shopping-recipes-v1';
  const purchasedItemsKey = 'this-week-purchased-items-v1';
  const removedItemsKey = 'this-week-removed-items-v1';
  const legacyThisWeekRecipesKey = 'this-week-selected-recipes-v1';
  const defaultThisWeekRecipes = [];
  const weekDayOptions = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const prepUtilityId = 'this-week-prep';
  const weekUtilitySections = [{ id: 'utility', title: 'This Week', recipes: [prepUtilityId] }];
  const weekUtilityCatalog = {
    [prepUtilityId]: {
      id: prepUtilityId,
      title: 'Prep',
      name: 'Prep',
      subtitle: '',
      utility: true,
      href: './docs/combined-shopping/this-week-prep.html',
      icon: '🔪'
    }
  };
  const thisWeekCatalog = { ...window.JEFES_KITCHEN_CATALOG.recipes, ...weekUtilityCatalog };
  const servingData = window.JEFES_RECIPE_SERVINGS || {};

  function servingInfo(recipe) {
    const info = servingData[recipe.id] || {};
    const servingType = info.servingType || (recipe.utility ? 'utility' : (recipe.section === 'snackies' ? 'servings' : 'people'));
    return {
      baseServings: Number(info.baseServings || (servingType === 'utility' ? 1 : (servingType === 'servings' ? 4 : 2))),
      defaultServings: Number(info.defaultServings || (servingType === 'utility' ? 1 : (servingType === 'servings' ? 8 : 3))),
      servingType
    };
  }

  function normalizeServingCount(recipe, value) {
    const info = servingInfo(recipe);
    const parsed = Number(value);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : info.defaultServings;
  }

  function servingLabel(recipe, servings) {
    const info = servingInfo(recipe);
    if (info.servingType === 'utility') return '';
    if (info.servingType === 'servings') return servings === 8 ? '6-8 servings' : servings + ' servings';
    return servings === 1 ? '1 serving' : servings + ' servings';
  }

  function withInstructionParams(url, recipe, options = {}) {
    const info = servingInfo(recipe);
    const servings = normalizeServingCount(recipe, options.servings);
    const [path, query = ''] = url.split('?');
    const params = new URLSearchParams(query);
    if (options.meal === 'lunch') params.set('meal', 'lunch');
    params.set('servings', String(servings));
    params.set('baseServings', String(info.baseServings));
    params.set('servingType', info.servingType);
    return path + '?' + params.toString();
  }
  let savedSections = {};
  let pendingInstructionLinks = null;
  let cloudThisWeekRecipes = null;
  let cloudShoppingRecipes = null;
  let cloudSyncStarted = false;
  let unwatchCloudPlans = null;
  let unwatchCloudShopping = null;

  function localDateKey(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function prunePastWeekPlans() {
    const today = localDateKey();
    const plans = loadThisWeekRecipes();
    const expired = plans.filter(entry => entry.date && entry.date < today);
    if (!expired.length) return false;

    const expiredIds = new Set(expired.map(entry => entry.id));
    const nextPlans = plans.filter(entry => !expiredIds.has(entry.id));
    const nextShopping = loadShoppingRecipes().filter(entry => !expiredIds.has(entry.id));
    cloudThisWeekRecipes = Array.isArray(cloudThisWeekRecipes) ? nextPlans : cloudThisWeekRecipes;
    cloudShoppingRecipes = Array.isArray(cloudShoppingRecipes) ? nextShopping : cloudShoppingRecipes;
    saveThisWeekRecipes(nextPlans);
    saveShoppingRecipes(nextShopping);
    expiredIds.forEach(clearPurchasedRecipe);

    if (window.KitchenCloud?.isSignedIn?.()) {
      expiredIds.forEach(recipeId => {
        window.KitchenCloud.removePlan(recipeId).catch(error => {
          console.warn('Kitchen sync expired plan remove unavailable', error);
        });
        window.KitchenCloud.removeShoppingRecipe(recipeId).catch(error => {
          console.warn('Kitchen sync expired shopping remove unavailable', error);
        });
      });
    }

    renderThisWeekPlans();
    populateWeekRecipeForm();
    return true;
  }

  function dateForDay(day) {
    if (!day) return '';
    const target = weekDayOptions.indexOf(day);
    if (target < 1) return '';
    const today = new Date();
    const todayIndex = today.getDay() === 0 ? 7 : today.getDay();
    const delta = (target - todayIndex + 7) % 7;
    const date = new Date(today);
    date.setDate(today.getDate() + delta);
    return localDateKey(date);
  }

  function recipeCardHtml(recipe, options = {}) {
    if (recipe.utility) {
      const removeButton = options.remove
        ? `<button class="week-remove-btn" type="button" data-remove-this-week="${recipe.id}" aria-label="Remove ${recipe.title} from This Week" title="Remove from This Week">×</button>`
        : '';
      return `
      <div class="card recipe-card" data-card-href="${recipe.href}" data-recipe-id="${recipe.id}" data-week-entry="${options.weekEntry ? 'true' : ''}" role="link" tabindex="0">
        <div class="card-copy">
          <div class="card-title">${recipe.title}</div>
        </div>
        <div class="card-actions" aria-label="${recipe.title} link">
          <a class="icon-link" href="${recipe.href}" aria-label="${recipe.title}" title="${recipe.title}">${recipe.icon || '•'}</a>
          ${removeButton}
        </div>
      </div>
    `;
    }
    const groceryLink = options.includeGrocery !== false && recipe.grocery
      ? `<a class="icon-link" href="${recipe.grocery}" aria-label="${recipe.title} grocery list" title="Grocery List">🛒</a>`
      : '';
    const removeButton = options.remove
      ? `<button class="week-remove-btn" type="button" data-remove-this-week="${recipe.id}" aria-label="Remove ${recipe.title} from This Week" title="Remove from This Week">×</button>`
      : '';
    const mealLabel = options.meal === 'lunch' ? 'Lunch' : '';
    const servings = normalizeServingCount(recipe, options.servings);
    const defaultServings = servingInfo(recipe).defaultServings;
    const servingsMeta = options.showServings && servings !== defaultServings ? servingLabel(recipe, servings) : '';
    const metaLabel = [options.day, mealLabel, servingsMeta].filter(Boolean).join(' · ');
    const planMeta = metaLabel ? `<span class="plan-meta">${metaLabel}</span>` : '';
    const instructionPhone = withInstructionParams(recipe.phone, recipe, { meal: options.meal, servings });
    const instructionWide = withInstructionParams(recipe.wide, recipe, { meal: options.meal, servings });
    const titleBlock = metaLabel
      ? `<div class="title-line">${planMeta}<div class="card-title">${recipe.title}</div></div>`
      : `<div class="card-title">${recipe.title}</div>`;

    return `
      <div class="card recipe-card" data-default-instructions="true" data-recipe-id="${recipe.id}" data-week-entry="${options.weekEntry ? 'true' : ''}" data-phone="${instructionPhone}" data-wide="${instructionWide}" role="link" tabindex="0">
        <div class="card-copy">
          ${titleBlock}
          <span class="card-subtitle">${recipe.subtitle}</span>
        </div>
        <div class="card-actions" aria-label="${options.labelPrefix || ''}${recipe.title} links">
          <a class="icon-link" href="${recipe.menu}" aria-label="${recipe.title} menu" title="Menu">📜</a>
          ${groceryLink}
          <a class="icon-link instruction-choice-link" href="${instructionPhone}" data-phone="${instructionPhone}" data-wide="${instructionWide}" aria-label="${recipe.title} cooking instructions" title="Cooking Instructions">🥘</a>
          ${removeButton}
        </div>
      </div>
    `;
  }

  function renderRecipeGroups() {
    const root = document.getElementById('recipeGroups');
    if (!root) return;

    root.innerHTML = window.JEFES_KITCHEN_CATALOG.sections.map(section => `
      <details class="recipe-group" data-section="${section.id}">
        <summary class="group-label">${section.title}</summary>
        <div class="group-grid">
          ${section.recipes.map(recipeId => {
            const recipe = thisWeekCatalog[recipeId];
            if (!recipe) return '';
            return `<div class="section">${recipeCardHtml(recipe)}</div>`;
          }).join('')}
        </div>
      </details>
    `).join('');
  }

  function normalizeRecipeEntries(raw) {
    return raw
      .map(entry => typeof entry === 'string' ? { id: entry } : entry)
      .filter(entry => entry && thisWeekCatalog[entry.id])
      .map(entry => ({
        ...entry,
        servings: normalizeServingCount(thisWeekCatalog[entry.id], entry.servings)
      }));
  }

  function sortRecipeEntries(entries) {
    return [...entries].sort((a, b) => {
      if (a.date && b.date) return a.date.localeCompare(b.date);
      if (a.date) return -1;
      if (b.date) return 1;
      return 0;
    });
  }

  function loadThisWeekRecipes() {
    if (Array.isArray(cloudThisWeekRecipes)) return cloudThisWeekRecipes;

    const raw = localStorage.getItem(thisWeekRecipesKey);
    if (raw === null) {
      const legacy = localStorage.getItem(legacyThisWeekRecipesKey);
      if (legacy !== null) {
        try {
          return normalizeRecipeEntries(JSON.parse(legacy));
        } catch {
          return [...defaultThisWeekRecipes];
        }
      }
      return [...defaultThisWeekRecipes];
    }
    try {
      return normalizeRecipeEntries(JSON.parse(raw));
    } catch {
      return [...defaultThisWeekRecipes];
    }
  }

  function loadShoppingRecipes() {
    if (Array.isArray(cloudShoppingRecipes)) return cloudShoppingRecipes;

    const raw = localStorage.getItem(thisWeekShoppingRecipesKey);
    if (raw === null) {
      const legacy = localStorage.getItem(legacyThisWeekRecipesKey);
      if (legacy !== null) {
        try {
          return normalizeRecipeEntries(JSON.parse(legacy));
        } catch {
          return [];
        }
      }
      return [];
    }
    try {
      return normalizeRecipeEntries(JSON.parse(raw));
    } catch {
      return [];
    }
  }

  function saveThisWeekRecipes(entries) {
    localStorage.setItem(thisWeekRecipesKey, JSON.stringify(sortRecipeEntries(entries)));
  }

  function saveShoppingRecipes(entries) {
    localStorage.setItem(thisWeekShoppingRecipesKey, JSON.stringify(sortRecipeEntries(entries)));
  }

  function clearPurchasedRecipe(recipeId) {
    try {
      const purchased = new Set(JSON.parse(localStorage.getItem(purchasedItemsKey)) || []);
      const removed = new Set(JSON.parse(localStorage.getItem(removedItemsKey)) || []);
      Array.from(purchased).forEach(itemId => {
        if (itemId.startsWith(`tw-${recipeId}-`)) purchased.delete(itemId);
      });
      Array.from(removed).forEach(itemId => {
        if (itemId.startsWith(`tw-${recipeId}-`)) removed.delete(itemId);
      });
      localStorage.setItem(purchasedItemsKey, JSON.stringify([...purchased]));
      localStorage.setItem(removedItemsKey, JSON.stringify([...removed]));
    } catch {
      localStorage.removeItem(purchasedItemsKey);
      localStorage.removeItem(removedItemsKey);
    }
  }

  function makeRecipeEntry(recipeId, day, meal = '', servings = '') {
    const recipe = thisWeekCatalog[recipeId];
    return {
      id: recipeId,
      day,
      date: dateForDay(day),
      meal,
      servings: normalizeServingCount(recipe, servings)
    };
  }

  async function saveRecipeEntry(key, entry) {
    const loader = key === thisWeekRecipesKey ? loadThisWeekRecipes : loadShoppingRecipes;
    const saver = key === thisWeekRecipesKey ? saveThisWeekRecipes : saveShoppingRecipes;

    if (key === thisWeekRecipesKey && window.KitchenCloud?.ensureSignedIn) {
      try {
        await window.KitchenCloud.ensureSignedIn();
        await window.KitchenCloud.savePlan(entry);
        return;
      } catch (error) {
        console.warn('Kitchen sync save unavailable; using local plan', error);
      }
    }
    if (key === thisWeekShoppingRecipesKey && window.KitchenCloud?.ensureSignedIn) {
      try {
        await window.KitchenCloud.ensureSignedIn();
        await window.KitchenCloud.saveShoppingRecipe(entry);
        clearPurchasedRecipe(entry.id);
        return;
      } catch (error) {
        console.warn('Kitchen shopping sync save unavailable; using local list', error);
      }
    }

    const entries = loader().filter(item => item.id !== entry.id);
    entries.push(entry);
    saver(entries);
    if (key === thisWeekShoppingRecipesKey) clearPurchasedRecipe(entry.id);
  }

  async function addRecipeEntry(key, recipeId, day, meal = '', servings = '') {
    await saveRecipeEntry(key, makeRecipeEntry(recipeId, day, meal, servings));
  }

  async function updateRecipeEntry(originalRecipeId, recipeId, day, meal = '', servings = '', addPlan = true, addShopping = true) {
    const entry = makeRecipeEntry(recipeId, day, meal, servings);
    if (originalRecipeId && originalRecipeId !== recipeId) {
      await removeThisWeekRecipe(originalRecipeId);
    }

    if (addPlan) {
      await saveRecipeEntry(thisWeekRecipesKey, entry);
    } else if (originalRecipeId || recipeId) {
      await removeThisWeekRecipe(originalRecipeId || recipeId);
    }

    if (addShopping) {
      await saveRecipeEntry(thisWeekShoppingRecipesKey, entry);
    } else {
      saveShoppingRecipes(loadShoppingRecipes().filter(item => item.id !== recipeId));
      if (window.KitchenCloud?.isSignedIn?.()) {
        try {
          await window.KitchenCloud.removeShoppingRecipe(recipeId);
        } catch (error) {
          console.warn('Kitchen shopping sync remove unavailable; removing local list item', error);
        }
      }
    }
    clearPurchasedRecipe(recipeId);
  }

  async function removeThisWeekRecipe(recipeId) {
    const nextPlans = loadThisWeekRecipes().filter(entry => entry.id !== recipeId);
    const nextShopping = loadShoppingRecipes().filter(entry => entry.id !== recipeId);
    cloudThisWeekRecipes = Array.isArray(cloudThisWeekRecipes) ? nextPlans : cloudThisWeekRecipes;
    cloudShoppingRecipes = Array.isArray(cloudShoppingRecipes) ? nextShopping : cloudShoppingRecipes;
    saveThisWeekRecipes(nextPlans);
    saveShoppingRecipes(nextShopping);
    clearPurchasedRecipe(recipeId);
    renderThisWeekPlans();
    prunePastWeekPlans();
    populateWeekRecipeForm();

    if (window.KitchenCloud?.isSignedIn?.()) {
      try {
        await window.KitchenCloud.removePlan(recipeId);
      } catch (error) {
        console.warn('Kitchen sync plan remove unavailable; removed locally', error);
      }
      try {
        await window.KitchenCloud.removeShoppingRecipe(recipeId);
      } catch (error) {
        console.warn('Kitchen sync shopping remove unavailable; removed locally', error);
      }
    }
  }

  function renderThisWeekPlans() {
    const grid = document.getElementById('thisWeekGrid');
    if (!grid) return;

    grid.querySelectorAll('.week-plan-card').forEach(card => card.remove());

    const entries = sortRecipeEntries(loadThisWeekRecipes());
    const orderedEntries = [
      ...entries.filter(entry => entry.id === prepUtilityId),
      ...entries.filter(entry => entry.id !== prepUtilityId)
    ];

    orderedEntries.forEach(entry => {
      const recipe = thisWeekCatalog[entry.id];
      const section = document.createElement('div');
      section.className = 'section week-plan-card';
      if (entry.date) section.dataset.planDate = entry.date;
      section.innerHTML = recipeCardHtml(recipe, {
        day: entry.day,
        meal: entry.meal,
        servings: entry.servings,
        showServings: true,
        includeGrocery: false,
        labelPrefix: 'This Week ',
        remove: true,
        weekEntry: true
      });
      grid.appendChild(section);
    });
    wireInstructionLinks();
  }

  renderRecipeGroups();
  renderThisWeekPlans();
  prunePastWeekPlans();

  function startCloudSync() {
    if (cloudSyncStarted || !window.KitchenCloud) return;
    cloudSyncStarted = true;

    window.KitchenCloud.watchAuth(user => {
      if (unwatchCloudPlans) {
        unwatchCloudPlans();
        unwatchCloudPlans = null;
      }
      if (unwatchCloudShopping) {
        unwatchCloudShopping();
        unwatchCloudShopping = null;
      }

      if (!user) {
        cloudThisWeekRecipes = null;
        cloudShoppingRecipes = null;
        renderThisWeekPlans();
        populateWeekRecipeForm();
        return;
      }

      unwatchCloudPlans = window.KitchenCloud.watchPlans(entries => {
        cloudThisWeekRecipes = sortRecipeEntries(normalizeRecipeEntries(entries));
        localStorage.setItem(thisWeekRecipesKey, JSON.stringify(cloudThisWeekRecipes));
        renderThisWeekPlans();
        prunePastWeekPlans();
        populateWeekRecipeForm();
      }, () => {
        cloudThisWeekRecipes = null;
        renderThisWeekPlans();
        populateWeekRecipeForm();
      });
      unwatchCloudShopping = window.KitchenCloud.watchShopping(snapshot => {
        cloudShoppingRecipes = sortRecipeEntries(normalizeRecipeEntries(snapshot.recipes));
        localStorage.setItem(thisWeekShoppingRecipesKey, JSON.stringify(cloudShoppingRecipes));
        populateWeekRecipeForm();
      }, () => {
        cloudShoppingRecipes = null;
        populateWeekRecipeForm();
      });
    });
  }

  try {
    savedSections = JSON.parse(localStorage.getItem(sectionStateKey) || '{}');
  } catch {
    savedSections = {};
  }

  document.querySelectorAll('details[data-section]').forEach(section => {
    const sectionName = section.dataset.section;
    if (savedSections[sectionName]) section.open = true;

    section.addEventListener('toggle', () => {
      savedSections[sectionName] = section.open;
      localStorage.setItem(sectionStateKey, JSON.stringify(savedSections));
    });
  });

  const instructionChoice = document.getElementById('instructionChoice');
  const resetInstructionChoice = document.getElementById('resetInstructionChoice');
  const addThisWeekRecipe = document.getElementById('addThisWeekRecipe');
  const weekChoice = document.getElementById('weekChoice');
  const weekRecipeForm = document.getElementById('weekRecipeForm');
  const weekRecipeSection = document.getElementById('weekRecipeSection');
  const weekRecipeChoice = document.getElementById('weekRecipeChoice');
  const weekRecipeDay = document.getElementById('weekRecipeDay');
  const weekRecipeLunch = document.getElementById('weekRecipeLunch');
  const weekRecipePlan = document.getElementById('weekRecipePlan');
  const weekRecipeShop = document.getElementById('weekRecipeShop');
  const weekRecipeServings = document.getElementById('weekRecipeServings');
  const cancelWeekRecipe = document.getElementById('cancelWeekRecipe');
  const weekChoiceTitle = document.getElementById('weekChoiceTitle');
  const weekRecipeSubmit = document.getElementById('weekRecipeSubmit');
  let weekChoiceMode = { type: 'add', originalRecipeId: '' };
  let suppressCardClick = false;
  let cardLongPressTimer = null;

  function populateWeekRecipeSections() {
    if (weekRecipeSection.options.length) return;
    [...weekUtilitySections, ...window.JEFES_KITCHEN_CATALOG.sections].forEach(section => {
      const option = document.createElement('option');
      option.value = section.id;
      option.textContent = section.title;
      weekRecipeSection.appendChild(option);
    });
  }

  function populateWeekServings(selectedServings = '') {
    if (!weekRecipeServings) return;
    const recipe = thisWeekCatalog[weekRecipeChoice.value];
    if (!recipe) return;
    const info = servingInfo(recipe);
    if (recipe.utility) {
      weekRecipeServings.innerHTML = '<option value="1">Prep</option>';
      weekRecipeServings.value = '1';
      return;
    }
    const options = info.servingType === 'servings'
      ? [
          [4, '4 servings'],
          [8, '6-8 servings'],
          [12, '12 servings']
        ]
      : [
          [2, '2 servings'],
          [3, '3 servings'],
          [4, '4 servings'],
          [5, '5 servings'],
          [6, '6 servings']
        ];
    weekRecipeServings.innerHTML = '';
    options.forEach(([value, label]) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      weekRecipeServings.appendChild(option);
    });
    const desired = String(selectedServings || info.defaultServings);
    weekRecipeServings.value = [...weekRecipeServings.options].some(option => option.value === desired)
      ? desired
      : String(info.defaultServings);
  }

  function sectionIdForRecipe(recipeId) {
    if (weekUtilityCatalog[recipeId]) return 'utility';
    return window.JEFES_KITCHEN_CATALOG.sections.find(section => section.recipes.includes(recipeId))?.id || '';
  }

  function populateWeekRecipeForm(selectedRecipeId = '', selectedServings = '') {
    populateWeekRecipeSections();
    const selectedSectionId = selectedRecipeId ? sectionIdForRecipe(selectedRecipeId) : '';
    if (selectedSectionId) {
      weekRecipeSection.value = selectedSectionId;
    } else if (!weekRecipeSection.value && window.JEFES_KITCHEN_CATALOG.sections[0]) {
      weekRecipeSection.value = window.JEFES_KITCHEN_CATALOG.sections[0].id;
    }
    const weekSections = [...weekUtilitySections, ...window.JEFES_KITCHEN_CATALOG.sections];
    const selectedSection = weekSections
      .find(section => section.id === weekRecipeSection.value)
      || weekSections[0];
    weekRecipeChoice.innerHTML = '';
    (selectedSection?.recipes || [])
      .map(recipeId => [recipeId, thisWeekCatalog[recipeId]])
      .filter(([, recipe]) => recipe)
      .sort(([, a], [, b]) => a.title.localeCompare(b.title))
      .forEach(([recipeId, recipe]) => {
        const option = document.createElement('option');
        option.value = recipeId;
        option.textContent = recipe.title;
        weekRecipeChoice.appendChild(option);
      });

    if (selectedRecipeId && [...weekRecipeChoice.options].some(option => option.value === selectedRecipeId)) {
      weekRecipeChoice.value = selectedRecipeId;
    }
    populateWeekServings(selectedServings);
    syncWeekUtilityControls();

    if (!weekRecipeDay.options.length) {
      weekDayOptions.forEach(day => {
        const option = document.createElement('option');
        option.value = day;
        option.textContent = day || 'No day';
        weekRecipeDay.appendChild(option);
      });
    }
  }

  function syncWeekUtilityControls() {
    const recipe = thisWeekCatalog[weekRecipeChoice.value];
    const isUtility = !!recipe?.utility;
    weekRecipeLunch.checked = isUtility ? false : weekRecipeLunch.checked;
    weekRecipeLunch.disabled = isUtility;
    weekRecipeShop.checked = isUtility ? false : weekRecipeShop.checked;
    weekRecipeShop.disabled = isUtility;
    weekRecipeServings.disabled = isUtility;
    weekRecipeServings.style.display = isUtility ? 'none' : '';
    if (isUtility) weekRecipePlan.checked = true;
  }

  function openWeekChoice(options = {}) {
    const entry = options.entry || null;
    const recipeId = options.recipeId || entry?.id || '';
    const isEdit = options.mode === 'edit' && entry;
    const shoppingEntry = recipeId ? loadShoppingRecipes().find(item => item.id === recipeId) : null;
    weekChoiceMode = { type: isEdit ? 'edit' : 'add', originalRecipeId: isEdit ? entry.id : '' };
    weekChoiceTitle.textContent = isEdit ? 'Edit Recipe' : 'Add Recipe';
    weekRecipeSubmit.textContent = isEdit ? 'Update' : 'Add';
    populateWeekRecipeForm(recipeId, entry?.servings);
    weekRecipeDay.value = entry?.day || '';
    const isUtility = !!thisWeekCatalog[recipeId]?.utility;
    weekRecipeLunch.checked = isUtility ? false : (entry?.meal || '') === 'lunch';
    weekRecipePlan.checked = true;
    weekRecipeShop.checked = isUtility ? false : (isEdit ? !!shoppingEntry : true);
    if (entry?.servings) populateWeekServings(entry.servings);
    syncWeekUtilityControls();
    weekChoice.classList.add('is-open');
    weekChoice.setAttribute('aria-hidden', 'false');
    weekRecipeSection.focus();
  }

  function closeWeekChoice() {
    weekChoice.classList.remove('is-open');
    weekChoice.setAttribute('aria-hidden', 'true');
    weekChoiceMode = { type: 'add', originalRecipeId: '' };
  }

  window.addEventListener('kitchen-cloud-ready', startCloudSync);
  startCloudSync();

  function detectedInstructionLayout() {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    const touchPoints = navigator.maxTouchPoints || 0;
    const looksLikeWideTouch = new RegExp('iP' + 'ad', 'i').test(ua) || (platform === 'MacIntel' && touchPoints > 1);
    const looksLikePhone = /iPhone|iPod|Android.*Mobile/i.test(ua);

    if (looksLikePhone) return 'phone';
    if (looksLikeWideTouch) return 'wide';
    return 'wide';
  }

  function closeInstructionChoice() {
    instructionChoice.classList.remove('is-open');
    instructionChoice.setAttribute('aria-hidden', 'true');
    pendingInstructionLinks = null;
  }

  function openInstructionChoice(links) {
    pendingInstructionLinks = links;
    instructionChoice.classList.add('is-open');
    instructionChoice.setAttribute('aria-hidden', 'false');
  }

  function openDefaultInstructions(links) {
    const savedPreference = localStorage.getItem(instructionPreferenceKey);
    const devicePreference = detectedInstructionLayout();
    const legacyWidePreference = 'ip' + 'ad';
    const normalizedPreference = savedPreference === legacyWidePreference ? 'wide' : savedPreference;
    if (savedPreference === legacyWidePreference) localStorage.setItem(instructionPreferenceKey, 'wide');
    const preference = normalizedPreference === 'ask' ? '' : (normalizedPreference || devicePreference);

    if (preference && links[preference]) {
      if (!normalizedPreference) localStorage.setItem(instructionPreferenceKey, preference);
      window.location.href = links[preference];
      return;
    }

    openInstructionChoice(links);
  }

  function wireInstructionLinks() {
    document.querySelectorAll('.instruction-choice-link').forEach(link => {
      if (link.dataset.choiceWired) return;
      link.dataset.choiceWired = 'true';
      link.addEventListener('click', event => {
      event.preventDefault();
      const links = {
        phone: link.dataset.phone,
        wide: link.dataset.wide
      };
      openDefaultInstructions(links);
    });
    });
  }

  function openWeekChoiceForCard(card) {
    if (!card?.dataset?.recipeId) return false;
    const recipeId = card.dataset.recipeId;
    if (!thisWeekCatalog[recipeId]) return false;
    const entry = card.dataset.weekEntry === 'true'
      ? loadThisWeekRecipes().find(item => item.id === recipeId)
      : null;
    openWeekChoice(entry ? { mode: 'edit', entry } : { mode: 'add', recipeId });
    return true;
  }

  function clearCardLongPress() {
    if (cardLongPressTimer) {
      clearTimeout(cardLongPressTimer);
      cardLongPressTimer = null;
    }
  }

  wireInstructionLinks();

  document.addEventListener('contextmenu', event => {
    if (event.target.closest('a, button, input, select, textarea, label')) return;
    const card = event.target.closest('.recipe-card[data-recipe-id]');
    if (!card) return;
    event.preventDefault();
    suppressCardClick = true;
    openWeekChoiceForCard(card);
    setTimeout(() => { suppressCardClick = false; }, 250);
  });

  document.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.target.closest('a, button, input, select, textarea, label')) return;
    const card = event.target.closest('.recipe-card[data-recipe-id]');
    if (!card) return;
    clearCardLongPress();
    cardLongPressTimer = setTimeout(() => {
      suppressCardClick = true;
      openWeekChoiceForCard(card);
      setTimeout(() => { suppressCardClick = false; }, 450);
    }, 600);
  });

  ['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach(eventName => {
    document.addEventListener(eventName, clearCardLongPress, { passive: true });
  });

  document.addEventListener('click', event => {
    if (suppressCardClick) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    if (event.target.closest('a, button, input, select, textarea, label')) return;
    const card = event.target.closest('[data-card-href], [data-default-instructions]');
    if (!card) return;
    if (card.dataset.cardHref) {
      window.location.href = card.dataset.cardHref;
      return;
    }
    openDefaultInstructions({
      phone: card.dataset.phone,
      wide: card.dataset.wide
    });
  });

  document.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const card = event.target.closest('[data-card-href], [data-default-instructions]');
    if (!card || event.target !== card) return;
    event.preventDefault();
    if (card.dataset.cardHref) {
      window.location.href = card.dataset.cardHref;
      return;
    }
    openDefaultInstructions({
      phone: card.dataset.phone,
      wide: card.dataset.wide
    });
  });

  instructionChoice.addEventListener('click', event => {
    if (event.target === instructionChoice) {
      closeInstructionChoice();
      return;
    }

    const choice = event.target.dataset.choice;
    if (!choice) return;
    if (choice === 'cancel') {
      closeInstructionChoice();
      return;
    }
    if (pendingInstructionLinks && pendingInstructionLinks[choice]) {
      localStorage.setItem(instructionPreferenceKey, choice);
      window.location.href = pendingInstructionLinks[choice];
    }
  });

  addThisWeekRecipe.addEventListener('click', event => {
    event.preventDefault();
    event.stopPropagation();
    openWeekChoice();
  });

  weekChoice.addEventListener('click', event => {
    if (event.target === weekChoice) closeWeekChoice();
  });

  cancelWeekRecipe.addEventListener('click', closeWeekChoice);
  weekRecipeSection.addEventListener('change', () => populateWeekRecipeForm());
  weekRecipeChoice.addEventListener('change', () => {
    populateWeekServings();
    syncWeekUtilityControls();
  });

  document.getElementById('thisWeekGrid')?.addEventListener('click', event => {
    const button = event.target.closest('[data-remove-this-week]');
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();
    removeThisWeekRecipe(button.dataset.removeThisWeek);
  });

  weekRecipeForm.addEventListener('submit', async event => {
    event.preventDefault();
    const recipeId = weekRecipeChoice.value;
    const day = weekRecipeDay.value;
    const selectedRecipe = thisWeekCatalog[recipeId];
    const isUtility = !!selectedRecipe?.utility;
    const meal = isUtility ? '' : (weekRecipeLunch.checked ? 'lunch' : '');
    const servings = isUtility ? '1' : weekRecipeServings.value;
    const addPlan = isUtility ? true : weekRecipePlan.checked;
    const addShopping = isUtility ? false : weekRecipeShop.checked;

    if (!addPlan && !addShopping) return;

    if (weekChoiceMode.type === 'edit') {
      await updateRecipeEntry(weekChoiceMode.originalRecipeId, recipeId, day, meal, servings, addPlan, addShopping);
    } else {
      if (addPlan) {
        await addRecipeEntry(thisWeekRecipesKey, recipeId, day, meal, servings);
      }
      if (addShopping) {
        await addRecipeEntry(thisWeekShoppingRecipesKey, recipeId, day, meal, servings);
      }
    }

    closeWeekChoice();
    renderThisWeekPlans();
    prunePastWeekPlans();
  });

  resetInstructionChoice.addEventListener('click', () => {
    localStorage.setItem(instructionPreferenceKey, 'ask');
    resetInstructionChoice.textContent = 'Instruction layout reset';
    setTimeout(() => {
      resetInstructionChoice.textContent = 'Reset instruction layout';
    }, 1400);
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && instructionChoice.classList.contains('is-open')) {
      closeInstructionChoice();
    }
    if (event.key === 'Escape' && weekChoice.classList.contains('is-open')) {
      closeWeekChoice();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>

</body>
</html>
